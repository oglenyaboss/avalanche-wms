hostPort: debezium-connect:9012
ssl: false
lowercaseOutputName: true
lowercaseOutputLabelNames: true

rules:
  - pattern: "kafka.connect<type=connect-worker-metrics, connector=(.+)><>connector-running-task-count"
    name: debezium_running_task_count
    labels:
      connector: "$1"
    type: GAUGE
