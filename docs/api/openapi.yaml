# ════════════════════════════════════════════════════════════════════════════
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access-токен (HS256). Claims: `user_id`, `role`, `type="access"`, `iat`, `exp`.
        Получить — через `POST /auth/login`. Refresh-токены (`type="refresh"`) роль не несут.

  responses:
    # ── Бизнес-модули: JSON-конверт ──────────────────────────────────────────
    JSONBadRequest:
      description: '`INVALID_REQUEST` — битый JSON, лишнее поле (DisallowUnknownFields), не-UUID.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error: { code: INVALID_REQUEST, message: Невалидный JSON в теле запроса }
    PlainTextUnauthorized:
      description: |
        Отсутствует/невалиден JWT. Ответ формирует `auth.Middleware`
        (`http.Error(w, "unauthorized", 401)`) — простой текст, без JSON-конверта.
      content:
        text/plain:
          schema:
            type: string
          example: |
            unauthorized
    JSONForbidden:
      description: '`FORBIDDEN` — роль не разрешена для этого эндпоинта.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error: { code: FORBIDDEN, message: Только оператор может выполнять это действие }
    JSONInternal:
      description: '`INTERNAL_ERROR` — ошибка БД или непредвиденная ошибка.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error: { code: INTERNAL_ERROR, message: Внутренняя ошибка сервера }
    JSONServiceUnavailable:
      description: |
        `INTERNAL_ERROR` — ошибка БД/инфраструктуры. Модуль `dispatches` отдаёт
        внутренние ошибки именно как `503` (не `500`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error: { code: INTERNAL_ERROR, message: 'failed to get dispatch by id ...' }

    # ── Модуль auth: простой текст ───────────────────────────────────────────
    AuthPlainTextBadRequest:
      description: 'Невалидное тело запроса (битый JSON / лишнее поле / нарушение валидации). Простой текст.'
      content:
        text/plain:
          schema:
            type: string
          example: |
            invalid request body
    AuthPlainTextUnauthorized:
      description: 'Неверные учётные данные, неактивный пользователь или невалидный токен. Простой текст.'
      content:
        text/plain:
          schema:
            type: string
          example: |
            unauthorized
    AuthPlainTextForbidden:
      description: 'Актёр не ADMIN (проверка по claim и по БД). Простой текст.'
      content:
        text/plain:
          schema:
            type: string
          example: |
            forbidden
    AuthPlainTextInternal:
      description: 'Ошибка БД, bcrypt или генерации токена. Простой текст.'
      content:
        text/plain:
          schema:
            type: string
          example: |
            internal server error

  schemas:
    # ── Общие конверты ───────────────────────────────────────────────────────
    SuccessEnvelope:
      type: object
      description: Универсальный конверт успешного ответа бизнес-модулей.
      required: [success, data, error]
      properties:
        success:
          type: boolean
          const: true
        data:
          description: Полезная нагрузка (тип зависит от операции).
        error:
          type: 'null'
    ErrorEnvelope:
      type: object
      description: Универсальный конверт ошибки бизнес-модулей.
      required: [success, data, error]
      properties:
        success:
          type: boolean
          const: false
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/APIError'
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинно-читаемый код ошибки (ASCII).
          example: INVALID_REQUEST
        message:
          type: string
          description: Сообщение для пользователя (на русском).
          example: Невалидный JSON в теле запроса

    HealthResponse:
      type: object
      description: 'Особый формат `/health` — без конверта.'
      required: [status, checks, time]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            type: string
          description: 'Карта `<зависимость> → "ok" | <текст ошибки>`.'
          example: { postgres: ok, kafka: ok, ledger_adapter: ok }
        time:
          type: string
          format: date-time

    # ── Auth DTO ─────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username:
          type: string
          description: Непустой логин.
        password:
          type: string
          minLength: 6
          maxLength: 72
          description: Длина 6..72 байта включительно.
        role:
          $ref: '#/components/schemas/UserRole'
    TokenPair:
      type: object
      description: 'Сырой JSON без конверта (ответ /auth/login и /auth/refresh).'
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    RegisterResponse:
      type: object
      description: 'Сырой JSON без конверта (ответ /auth/register).'
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string

    # ── Доменные enum'ы ──────────────────────────────────────────────────────
    UserRole:
      type: string
      enum: [ADMIN, OPERATOR, CUSTOMER, AUDITOR]
      description: Роль пользователя (DB enum public.user_role).
    ProductStatus:
      type: string
      enum: [RECEIVED, STORED, ALLOCATED, ASSEMBLED, READY_TO_SHIP, SHIPPED]
      description: Статус товара (DB enum wms_inventory.product_status).
    OrderStatus:
      type: string
      enum: [NEW, ALLOCATED, ASSEMBLED, PARTIALLY_SHIPPED, SHIPPED]
      description: Статус заказа (DB enum wms_inventory.order_status).
    TaskStatus:
      type: string
      enum: [PENDING, IN_PROGRESS, DONE, CANCELLED]
      description: 'Статус задачи сборки (DB enum wms_ops.task_status). IN_PROGRESS/CANCELLED — зарезервированы, без write-пути в текущей реализации.'
    OutboundDispatchStatus:
      type: string
      enum: [SCHEDULED, AT_GATE, DEPARTED, CANCELLED]
      description: Статус исходящего рейса.
    CargoplaceStatus:
      type: string
      enum: [EXPECTED, RECEIVED_AT_GATE, NOT_RECEIVED, TABLE_IN_PROGRESS, TABLE_CLOSED]
      description: 'Статус грузоместа (в БД — text, не enum).'
    ShipmentStatus:
      type: string
      enum: [CREATED, GATE_IN_PROGRESS, GATE_CLOSED]
      description: 'Статус входящей поставки (в БД — text, не enum).'
    BoxStatus:
      type: string
      enum: [OPEN, CLOSED]
      description: 'Статус коробки (в БД — text, не enum).'

    # ── Доменные сущности ────────────────────────────────────────────────────
    OutboundDispatch:
      type: object
      description: 'Плановый исходящий рейс. DB: wms_inventory.outbound_dispatches.'
      required:
        - dispatch_id
        - dispatch_code
        - warehouse_id
        - destination_id
        - vehicle_number
        - driver_name
        - status
        - scheduled_at
        - created_at
        - updated_at
      properties:
        dispatch_id:
          type: string
          format: uuid
        dispatch_code:
          type: string
          example: DSP-2026-0531-001
        warehouse_id:
          type: integer
          format: int64
        destination_id:
          type: string
          format: uuid
        vehicle_number:
          type: string
        driver_name:
          type: string
        driver_phone:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/OutboundDispatchStatus'
        scheduled_at:
          type: string
          format: date-time
        arrived_at:
          type: [string, 'null']
          format: date-time
        departed_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ── Destinations: ответы ─────────────────────────────────────────────────
    DestinationItem:
      type: object
      description: 'Магазин-получатель (обрезанный DTO без created_at/updated_at). DB: wms_inventory.destinations.'
      required:
        - destination_id
        - code
        - name
        - warehouse_id
      properties:
        destination_id:
          type: string
          format: uuid
        code:
          type: string
          example: SHOP-5
        name:
          type: string
          example: Магазин №5 Маросейка
        address:
          type: [string, 'null']
          example: 'г. Москва, ул. Маросейка, 5'
        warehouse_id:
          type: integer
          format: int64
    DestinationListResponse:
      type: object
      description: 'Тело поля `data` в ответе `GET /destinations`.'
      required: [destinations]
      properties:
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/DestinationItem'

    # ── Analytics: ответы ────────────────────────────────────────────────────
    AnalyticsStatusBucket:
      type: object
      description: 'Пара «статус → количество» для разбивки по жизненному циклу.'
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer
          format: int64
    AnalyticsTotals:
      type: object
      description: 'Итоговые счётчики справочных таблиц.'
      required: [skus, products, orders, dispatches, destinations]
      properties:
        skus: { type: integer, format: int64 }
        products: { type: integer, format: int64 }
        orders: { type: integer, format: int64 }
        dispatches: { type: integer, format: int64 }
        destinations: { type: integer, format: int64 }
    AnalyticsSummaryResponse:
      type: object
      description: 'Тело поля `data` в ответе `GET /analytics/summary`.'
      required: [totals, events_today, products_by_status, orders_by_status, dispatches_by_status]
      properties:
        totals:
          $ref: '#/components/schemas/AnalyticsTotals'
        events_today:
          type: integer
          format: int64
        products_by_status:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsStatusBucket'
        orders_by_status:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsStatusBucket'
        dispatches_by_status:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsStatusBucket'
    OnchainStageBreakdown:
      type: object
      description: 'Разбивка подтверждения on-chain для одного этапа склада. `pending` сворачивает явные PENDING и события, ещё не записанные в блокчейн.'
      required: [aggregate_type, total, committed, sent, pending, failed]
      properties:
        aggregate_type: { type: string }
        total: { type: integer, format: int64 }
        committed: { type: integer, format: int64 }
        sent: { type: integer, format: int64 }
        pending: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
    OnchainEventRef:
      type: object
      description: 'Одно событие в лентах последних отклонённых/подтверждённых.'
      required: [event_id, aggregate_type, updated_at]
      properties:
        event_id:
          type: string
          format: uuid
        aggregate_type:
          type: string
        tx_hash:
          type: [string, 'null']
        error_message:
          type: [string, 'null']
        updated_at:
          type: string
          format: date-time
    AnalyticsOnchainResponse:
      type: object
      description: 'Тело поля `data` в ответе `GET /analytics/onchain`.'
      required: [total_events, committed, sent, pending, failed, confirmation_rate, by_stage, recent_failed, recent_committed]
      properties:
        total_events: { type: integer, format: int64 }
        committed: { type: integer, format: int64 }
        sent: { type: integer, format: int64 }
        pending: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        confirmation_rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
        by_stage:
          type: array
          items:
            $ref: '#/components/schemas/OnchainStageBreakdown'
        recent_failed:
          type: array
          items:
            $ref: '#/components/schemas/OnchainEventRef'
        recent_committed:
          type: array
          items:
            $ref: '#/components/schemas/OnchainEventRef'
    AnalyticsThroughputSeries:
      type: object
      description: 'Одна полоса стека: этап и его счётчики по дням (позиционно выровнены с `days`).'
      required: [aggregate_type, counts]
      properties:
        aggregate_type:
          type: string
        counts:
          type: array
          items:
            type: integer
            format: int64
    AnalyticsThroughputResponse:
      type: object
      description: 'Тело поля `data` в ответе `GET /analytics/throughput`.'
      required: [days, series, totals]
      properties:
        days:
          type: array
          description: 'Непрерывная ось дат (формат YYYY-MM-DD), по возрастанию.'
          items:
            type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/AnalyticsThroughputSeries'
        totals:
          type: array
          description: 'Сумма по всем полосам для каждого дня (позиционно с `days`).'
          items:
            type: integer
            format: int64

    # ── Receiving: запросы ───────────────────────────────────────────────────
    ScanTTNRequest:
      type: object
      additionalProperties: false
      required: [ttn_code]
      properties:
        ttn_code:
          type: string
          maxLength: 256
    ScanGateCargoplaceRequest:
      type: object
      additionalProperties: false
      required: [shipment_id, cargoplace_code]
      properties:
        shipment_id:
          type: string
          format: uuid
        cargoplace_code:
          type: string
          maxLength: 256
    AcceptShipmentRequest:
      type: object
      additionalProperties: false
      required: [shipment_id]
      properties:
        shipment_id:
          type: string
          format: uuid
    ScanTableCargoplaceRequest:
      type: object
      additionalProperties: false
      required: [cargoplace_id]
      properties:
        cargoplace_id:
          type: string
          format: uuid
    ScanBoxRequest:
      type: object
      additionalProperties: false
      required: [cargoplace_id, box_barcode]
      properties:
        cargoplace_id:
          type: string
          format: uuid
        box_barcode:
          type: string
          maxLength: 256
    ScanSKURequest:
      type: object
      additionalProperties: false
      required: [cargoplace_id, box_id, barcode]
      properties:
        cargoplace_id:
          type: string
          format: uuid
        box_id:
          type: string
          format: uuid
        barcode:
          type: string
          maxLength: 256
    ScanQRRequest:
      type: object
      additionalProperties: false
      required: [cargoplace_id, box_id, sku_id, qr_code]
      properties:
        cargoplace_id:
          type: string
          format: uuid
        box_id:
          type: string
          format: uuid
        sku_id:
          type: string
          format: uuid
        qr_code:
          type: string
          maxLength: 256
    CloseBoxRequest:
      type: object
      additionalProperties: false
      required: [box_id]
      properties:
        box_id:
          type: string
          format: uuid
    ScanBufferReceivingRequest:
      type: object
      additionalProperties: false
      required: [cargoplace_id, buffer_bin_id]
      properties:
        cargoplace_id:
          type: string
          format: uuid
        buffer_bin_id:
          type: string
          format: uuid
    CloseCargoplaceRequest:
      type: object
      additionalProperties: false
      required: [cargoplace_id]
      properties:
        cargoplace_id:
          type: string
          format: uuid

    # ── Receiving: ответы ────────────────────────────────────────────────────
    CargoplaceView:
      type: object
      required: [cargoplace_id, cargoplace_code, status]
      properties:
        cargoplace_id:
          type: string
          format: uuid
        cargoplace_code:
          type: string
        status:
          $ref: '#/components/schemas/CargoplaceStatus'
    Progress:
      type: object
      required: [total, received, remaining, not_received]
      properties:
        total:
          type: integer
        received:
          type: integer
        remaining:
          type: integer
        not_received:
          type: integer
    ReceivingProgress:
      type: object
      required: [received_in_cargoplace, expected_in_cargoplace]
      properties:
        received_in_cargoplace:
          type: integer
        expected_in_cargoplace:
          type: integer
    ExpectedSKU:
      type: object
      required: [sku_id, sku_name, expected_qty]
      properties:
        sku_id:
          type: string
          format: uuid
        sku_name:
          type: string
        expected_qty:
          type: integer
    ShortageBySKU:
      type: object
      required: [sku_name, expected, received, shortage]
      properties:
        sku_name:
          type: string
        expected:
          type: integer
        received:
          type: integer
        shortage:
          type: integer
    CloseCargoplaceSummary:
      type: object
      required: [products_received, products_expected, shortage, shortage_by_sku]
      properties:
        products_received:
          type: integer
        products_expected:
          type: integer
        shortage:
          type: integer
        shortage_by_sku:
          type: array
          items:
            $ref: '#/components/schemas/ShortageBySKU'
    ScanTTNResult:
      type: object
      required: [shipment_id, ttn_code, status, cargoplaces, total_cargoplaces, received_cargoplaces]
      properties:
        shipment_id:
          type: string
          format: uuid
        ttn_code:
          type: string
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        cargoplaces:
          type: array
          items:
            $ref: '#/components/schemas/CargoplaceView'
        total_cargoplaces:
          type: integer
        received_cargoplaces:
          type: integer
    ScanGateCargoplaceResult:
      type: object
      required: [cargoplace_id, cargoplace_code, status, received_at_gate_at, progress]
      properties:
        cargoplace_id:
          type: string
          format: uuid
        cargoplace_code:
          type: string
        status:
          $ref: '#/components/schemas/CargoplaceStatus'
        received_at_gate_at:
          type: string
          format: date-time
        progress:
          $ref: '#/components/schemas/Progress'
    AcceptShipmentResult:
      type: object
      required: [shipment_id, status, summary]
      properties:
        shipment_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        summary:
          $ref: '#/components/schemas/Progress'
    ScanTableCargoplaceResult:
      type: object
      required: [cargoplace_id, cargoplace_code, status, expected_skus, total_expected]
      properties:
        cargoplace_id:
          type: string
          format: uuid
        cargoplace_code:
          type: string
        status:
          $ref: '#/components/schemas/CargoplaceStatus'
        expected_skus:
          type: array
          items:
            $ref: '#/components/schemas/ExpectedSKU'
        total_expected:
          type: integer
    ScanBoxResult:
      type: object
      required: [box_id, box_barcode, status]
      properties:
        box_id:
          type: string
          format: uuid
        box_barcode:
          type: string
        status:
          $ref: '#/components/schemas/BoxStatus'
    ScanSKUResult:
      type: object
      required: [sku_id, sku_name, barcode, message]
      properties:
        sku_id:
          type: string
          format: uuid
        sku_name:
          type: string
        barcode:
          type: string
        message:
          type: string
          example: Наклейте QR на товар
    ScanQRResult:
      type: object
      required: [product_id, sku_id, sku_name, qr_code, status, progress]
      properties:
        product_id:
          type: string
          format: uuid
        sku_id:
          type: string
          format: uuid
        sku_name:
          type: string
        qr_code:
          type: string
        status:
          $ref: '#/components/schemas/ProductStatus'
        progress:
          $ref: '#/components/schemas/ReceivingProgress'
    CloseBoxResult:
      type: object
      required: [box_id, status, products_in_box]
      properties:
        box_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BoxStatus'
        products_in_box:
          type: integer
    ScanBufferReceivingResult:
      type: object
      required: [buffer_bin_id, buffer_code, products_placed]
      properties:
        buffer_bin_id:
          type: string
          format: uuid
        buffer_code:
          type: string
        products_placed:
          type: integer
    CloseCargoplaceResult:
      type: object
      required: [cargoplace_id, operation_id, status, summary, outbox_events_created]
      properties:
        cargoplace_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
          description: Идентификатор подписанной операции для опроса статуса в цепи.
        status:
          $ref: '#/components/schemas/CargoplaceStatus'
        summary:
          $ref: '#/components/schemas/CloseCargoplaceSummary'
        outbox_events_created:
          type: integer
          description: Количество частей-действий операции, записанных в outbox (не товаров).

    # ── Putaway DTO ──────────────────────────────────────────────────────────
    PutawayScanBufferRequest:
      type: object
      additionalProperties: false
      required: [buffer_bin_id]
      properties:
        buffer_bin_id:
          type: string
          format: uuid
    ProductBufferItemResponse:
      type: object
      required: [product_id, sku_name, qr_code, status]
      properties:
        product_id:
          type: string
          format: uuid
        sku_name:
          type: string
        qr_code:
          type: string
        status:
          type: string
          description: 'Всегда "RECEIVED" (SQL фильтрует по status=RECEIVED).'
    PutawayScanBufferResponse:
      type: object
      required: [buffer_bin_id, buffer_code, products, total_products]
      properties:
        buffer_bin_id:
          type: string
          format: uuid
        buffer_code:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductBufferItemResponse'
        total_products:
          type: integer
    PutawayScanProductRequest:
      type: object
      additionalProperties: false
      required: [product_id, buffer_bin_id]
      properties:
        product_id:
          type: string
          format: uuid
        buffer_bin_id:
          type: string
          format: uuid
    PutawayScanProductResponse:
      type: object
      required: [product_id, sku_name, qr_code, cart_size]
      properties:
        product_id:
          type: string
          format: uuid
        sku_name:
          type: string
        qr_code:
          type: string
        cart_size:
          type: integer
    ScanStorageBinRequest:
      type: object
      additionalProperties: false
      required: [product_ids, storage_bin_id]
      properties:
        product_ids:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            format: uuid
        storage_bin_id:
          type: string
          format: uuid
    ScanStorageBinResponse:
      type: object
      required: [storage_bin_id, storage_bin_code, products_placed, outbox_events_created, operation_id]
      properties:
        storage_bin_id:
          type: string
          format: uuid
        storage_bin_code:
          type: string
        products_placed:
          type: integer
        outbox_events_created:
          type: integer
          description: Количество частей-действий операции, записанных в outbox (не товаров).
        operation_id:
          type: string
          format: uuid
          description: Идентификатор подписанной операции для опроса статуса в цепи.

    # ── Assembly DTO ─────────────────────────────────────────────────────────
    AllocateRequest:
      type: object
      additionalProperties: false
      required: [destination_id]
      properties:
        destination_id:
          type: string
          format: uuid
    InsufficientSKU:
      type: object
      required: [sku_id, sku_name, missing_qty]
      properties:
        sku_id:
          type: string
          format: uuid
        sku_name:
          type: string
        missing_qty:
          type: integer
    InsufficientOrder:
      type: object
      required: [order_id, missing_skus]
      properties:
        order_id:
          type: string
          format: uuid
        missing_skus:
          type: array
          items:
            $ref: '#/components/schemas/InsufficientSKU'
    AllocateResponse:
      type: object
      required: [allocated_orders, allocated_products, insufficient_orders]
      properties:
        allocated_orders:
          type: integer
        allocated_products:
          type: integer
        insufficient_orders:
          type: array
          items:
            $ref: '#/components/schemas/InsufficientOrder'
    TaskItem:
      type: object
      required: [task_id, product_id, qr_code, sku_name, from_bin_code, from_bin_section, order_no]
      properties:
        task_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        qr_code:
          type: string
        sku_name:
          type: string
        from_bin_code:
          type: string
        from_bin_section:
          type: string
        order_no:
          type: string
    TaskResponse:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskItem'
    PickRequest:
      type: object
      additionalProperties: false
      required: [product_id]
      properties:
        product_id:
          type: string
          format: uuid
    PickResponse:
      type: object
      required: [product_id, cart_size]
      properties:
        product_id:
          type: string
          format: uuid
        cart_size:
          type: integer
    AssemblyScanShippingBufferRequest:
      type: object
      additionalProperties: false
      required: [buffer_bin_id]
      properties:
        buffer_bin_id:
          type: string
          format: uuid
    ScanShippingBufferResponse:
      type: object
      required: [buffer_bin_id, products_placed, orders_assembled, operation_id]
      properties:
        buffer_bin_id:
          type: string
          format: uuid
        products_placed:
          type: integer
        orders_assembled:
          type: integer
        operation_id:
          type: string
          format: uuid
          description: Идентификатор подписанной Pick-операции для опроса статуса в цепи.

    # ── Dispatches DTO ───────────────────────────────────────────────────────
    NewDispatchQuery:
      type: object
      additionalProperties: false
      required: [destination_id, vehicle_number, driver_name, scheduled_at]
      properties:
        destination_id:
          type: string
          format: uuid
        vehicle_number:
          type: string
        driver_name:
          type: string
        driver_phone:
          type: [string, 'null']
          description: Опционально.
        scheduled_at:
          type: string
          format: date-time
          description: Не должен быть более чем на 1 минуту в прошлом.

    # ── Shipping DTO ─────────────────────────────────────────────────────────
    ShippingScanBufferRequest:
      type: object
      additionalProperties: false
      required: [buffer_bin_id]
      properties:
        buffer_bin_id:
          type: string
          format: uuid
    ScanDriverRequest:
      type: object
      additionalProperties: false
      required: [dispatch_code]
      properties:
        dispatch_code:
          type: string
    ShipHTTPRequest:
      type: object
      additionalProperties: false
      required: [buffer_bin_id, dispatch_id]
      properties:
        buffer_bin_id:
          type: string
          format: uuid
        dispatch_id:
          type: string
          format: uuid
        product_ids:
          type: array
          maxItems: 200
          description: 'Опционально. Пусто/отсутствует → bulk-режим; непусто → spot-режим.'
          items:
            type: string
            format: uuid
    Destination:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    BufferBin:
      type: object
      required: [id, code, destination]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        destination:
          $ref: '#/components/schemas/Destination'
    ScanBufferProduct:
      type: object
      required: [product_id, qr_code, sku_name, order_external_no]
      properties:
        product_id:
          type: string
          format: uuid
        qr_code:
          type: string
        sku_name:
          type: string
        order_external_no:
          type: [string, 'null']
    ScanBufferResponse:
      type: object
      required: [buffer_bin, products, count]
      properties:
        buffer_bin:
          $ref: '#/components/schemas/BufferBin'
        products:
          type: array
          items:
            $ref: '#/components/schemas/ScanBufferProduct'
        count:
          type: integer
    ScanDriverResponse:
      type: object
      required: [dispatch_id, dispatch_code, vehicle_number, driver_name, driver_phone, destination, status, arrived_at]
      properties:
        dispatch_id:
          type: string
          format: uuid
        dispatch_code:
          type: string
        vehicle_number:
          type: string
        driver_name:
          type: string
        driver_phone:
          type: [string, 'null']
        destination:
          $ref: '#/components/schemas/Destination'
        status:
          $ref: '#/components/schemas/OutboundDispatchStatus'
        arrived_at:
          type: [string, 'null']
          format: date-time
    ShipResponse:
      type: object
      required:
        - products_shipped
        - outbox_events_created
        - orders_completed
        - orders_partially_shipped
        - dispatch_departed
        - buffer_remaining
        - operation_id
      properties:
        products_shipped:
          type: integer
        outbox_events_created:
          type: integer
          description: Количество частей-действий операции, записанных в outbox (не товаров).
        orders_completed:
          type: integer
        orders_partially_shipped:
          type: integer
        dispatch_departed:
          type: boolean
        buffer_remaining:
          type: integer
        operation_id:
          type: string
          format: uuid
          description: Идентификатор подписанной операции для опроса статуса в цепи.

    # ── Подписанные действия (ADR-0001) ──────────────────────────────────────
    SignedActionDraft:
      type: object
      description: |
        Черновик подписанной складской операции (`signedops.DraftView`): одна часть на
        каждые ≤ 2000 товаров (ADR-0001 §10). Подписывается passkey оператора.
      required:
        - operation_id
        - action_type
        - signer_key_id
        - rp_id
        - allow_credentials
        - user_verification
        - timeout
        - parts
      properties:
        operation_id:
          type: string
          format: uuid
        action_type:
          type: integer
          description: '1 Receive, 2 PutAway, 3 Pick, 4 Ship (коды SignedAction.Type).'
          enum: [1, 2, 3, 4]
        signer_key_id:
          type: string
          description: keyId = keccak256(qx||qy), 0x-hex 32 байта.
        rp_id:
          type: string
          description: Relying Party ID для WebAuthn (из конфигурации WMS).
        allow_credentials:
          type: array
          items:
            type: object
            required: [type, id]
            properties:
              type:
                type: string
                const: public-key
              id:
                type: string
                description: WebAuthn credential id в base64url без паддинга.
        user_verification:
          type: string
          const: required
        timeout:
          type: integer
          example: 60000
        parts:
          type: array
          items:
            $ref: '#/components/schemas/SignedActionPart'
    SignedActionPart:
      type: object
      required: [action_id, item_ids, details_hash, challenge]
      properties:
        action_id:
          type: string
          format: uuid
        item_ids:
          type: array
          description: UUID товаров части в порядке возрастания itemId.
          items:
            type: string
            format: uuid
        details_hash:
          type: string
          description: keccak256 деталей действия (ADR-0001 §4), 0x-hex 32 байта.
        challenge:
          type: string
          description: 32 байта challenge в base64url без паддинга — их подписывает passkey.
    SignedActionSubmitRequest:
      type: object
      description: |
        Тело submit-запроса (`signedops.SubmitRequest`): по одному WebAuthn-assertion на
        каждую часть черновика.
      additionalProperties: false
      required: [operation_id, assertions]
      properties:
        operation_id:
          type: string
          format: uuid
        assertions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [action_id, credential_id, authenticator_data, client_data_json, signature]
            properties:
              action_id:
                type: string
                format: uuid
              credential_id:
                type: string
                description: base64url без паддинга.
              authenticator_data:
                type: string
                description: base64url без паддинга.
              client_data_json:
                type: string
                description: base64url без паддинга; challenge и type ищутся позиционно.
              signature:
                type: string
                description: base64url без паддинга, ASN.1 DER; бэкенд нормализует s к нижней половине.

    # ── Passkeys: ключи и подтверждения ────────────────────────────────────
    PasskeyStatus:
      type: string
      enum: [PENDING, ACTIVE, REJECTED, REVOKED]
      description: |
        Статус ключа (`passkey_credentials.status`). Живые — `PENDING` и `ACTIVE`;
        `ACTIVE`/`REVOKED` приходят синхронизацией с реестром цепи при чтении.
    PasskeyRole:
      type: string
      enum: [ADMIN, OPERATOR]
      description: Роль пользователя, с которой зарегистрирован ключ (регистрация доступна только ADMIN и OPERATOR).
    ConfirmationState:
      type: string
      enum: [SENT, APPLIED, REJECTED, FAILED]
      description: |
        Состояние подписанного действия в цепи, выводится из `onchain_events`:
        строки нет (или `PENDING`/`SENT`) → `SENT`, `COMMITTED` → `APPLIED`,
        `FAILED` с `reject_reason` → `REJECTED`, `FAILED` без причины → `FAILED`.
    PasskeyView:
      type: object
      description: 'Passkey пользователя: credential id, P-256-ключ и статус (`status` при чтении синхронизируется с реестром цепи).'
      required: [credential_id, key_id, qx, qy, role, status, created_at]
      properties:
        credential_id:
          type: string
          description: WebAuthn credential id в base64url без паддинга.
          example: vEJYj3dHhit9F8qLm0RGjXYkKluWjdI6W_1Lb3tQ6HA
        key_id:
          type: string
          description: 'keyId = keccak256(qx||qy), 0x-hex 32 байта.'
          example: '0x6f1c2a7b3d9e4c8a5b2f0d7e6c1a9b8d4e3f2a1c0b9d8e7f6a5b4c3d2e1f0a9b'
        qx:
          type: string
          description: X-координата P-256 ключа, 0x-hex 32 байта.
          example: '0x3f95d6e1c8b0a277441955670e8a2b1c4d5e6f708192a3b4c5d6e7f8091a2b37'
        qy:
          type: string
          description: Y-координата P-256 ключа, 0x-hex 32 байта.
          example: '0x4fa06e7f2d9c1b38840289755e5a0cc2b39c40d5f8a709e1b2c9d6e7f08fa3b4'
        role:
          $ref: '#/components/schemas/PasskeyRole'
        status:
          $ref: '#/components/schemas/PasskeyStatus'
        created_at:
          type: string
          format: date-time
          example: '2026-05-31T10:30:00Z'
    KeyConfirmation:
      type: object
      description: 'Состояние последнего ключевого действия (`KeyRegister`/`KeyRevoke`) в цепи; `null` — подтверждений ещё не было.'
      required: [action_id, action_type, state, reject_reason]
      properties:
        action_id:
          type: string
          format: uuid
        action_type:
          type: integer
          enum: [5, 6]
          description: '5 KeyRegister, 6 KeyRevoke (коды signedaction.Type).'
        state:
          $ref: '#/components/schemas/ConfirmationState'
        reject_reason:
          type: [integer, 'null']
          description: 'Код причины отклонения (ADR-0001 §6); `null`, пока отклонений нет.'
    OrganizationOverview:
      type: object
      description: 'Обзор организации: пользователи и их ключи (`passkeys/organization`).'
      required: [organization, members]
      properties:
        organization:
          type: object
          required: [org_id, name]
          properties:
            org_id:
              type: string
              format: uuid
            name:
              type: string
        members:
          type: array
          description: Все пользователи организации, без фильтра по ключам.
          items:
            type: object
            required: [user_id, username, role]
            properties:
              user_id:
                type: string
                format: uuid
              username:
                type: string
              role:
                $ref: '#/components/schemas/UserRole'
              passkey:
                description: Последний ключ сотрудника; `null`, если ключа нет.
                oneOf:
                  - $ref: '#/components/schemas/PasskeyView'
                  - type: 'null'
              confirmation:
                description: Подтверждение последнего ключевого действия ключа; `null`, если ключа или подтверждений нет.
                oneOf:
                  - $ref: '#/components/schemas/KeyConfirmation'
                  - type: 'null'
    AdminKeyExport:
      type: object
      description: |
        Публичный ключ админа в формате CLI владельца (`passkeys.AdminKeyExport`) —
        поля в camelCase, историческое исключение из snake_case (вместе с `audit`).
      required: [orgId, name, qx, qy]
      properties:
        orgId:
          type: string
          format: uuid
        name:
          type: string
          description: Название организации.
        qx:
          type: string
          description: X-координата P-256 ключа, 0x-hex 32 байта.
          example: '0x3f95d6e1c8b0a277441955670e8a2b1c4d5e6f708192a3b4c5d6e7f8091a2b37'
        qy:
          type: string
          description: Y-координата P-256 ключа, 0x-hex 32 байта.
          example: '0x4fa06e7f2d9c1b38840289755e5a0cc2b39c40d5f8a709e1b2c9d6e7f08fa3b4'

    # ── Passkeys: тела запросов (без DisallowUnknownFields, см. описание API) ─
    TargetKeyRequest:
      type: object
      description: 'Тело ключевых действий: цель — keyId (`0x` + 64 hex, = keccak256(qx||qy)).'
      required: [target_key_id]
      properties:
        target_key_id:
          type: string
          description: 'keyId цели, `0x` + 64 hex-символа.'
          example: '0xd2c3a11f6c8e5b79032877a4f2b0a6d5c4e7f8091a2b45678cddbb99eeff01278'
    WebAuthnAssertion:
      type: object
      description: |
        Один WebAuthn-assertion (`signedaction.AssertionRequest`) — тело submit;
        все поля — base64url без паддинга, как их отдаёт `navigator.credentials.get`.
        Тело ограничено 16 KiB.
      required: [credential_id, authenticator_data, client_data_json, signature]
      properties:
        credential_id:
          type: string
          description: base64url без паддинга.
        authenticator_data:
          type: string
          description: base64url без паддинга.
        client_data_json:
          type: string
          description: base64url без паддинга; challenge и type ищутся позиционно.
        signature:
          type: string
          description: base64url без паддинга, ASN.1 DER; бэкенд нормализует s к нижней половине.
    KeyActionDraft:
      type: object
      description: |
        Черновик ключевого действия (`keyActionDraftView`): материалы для подписи
        браузером админа. `item_ids` всегда пуст, `challenge` — 32 байта в base64url.
      required: [action_id, action_type, item_ids, subject_key, details_hash, signer_key_id, challenge, rp_id, allow_credentials, user_verification, timeout]
      properties:
        action_id:
          type: string
          format: uuid
        action_type:
          type: integer
          enum: [5, 6]
          description: '5 KeyRegister (подтвердить PENDING-ключ), 6 KeyRevoke (отозвать ACTIVE-ключ).'
        item_ids:
          type: array
          description: Для ключевых действий всегда пуст (товары они не меняют).
          items:
            type: string
            format: uuid
        subject_key:
          type: object
          description: P-256 ключ субъекта действия (ключ оператора из БД).
          required: [qx, qy]
          properties:
            qx:
              type: string
              description: 0x-hex 32 байта.
              example: '0x7fa09e1c2b3c4d5e6f708192a3b4c5d6e7f809a1b2c3d4e5f60718293a4b5c6d'
            qy:
              type: string
              description: 0x-hex 32 байта.
              example: '0x8fa09e0d1c2b3a4c5d6e7f8091a2b3c4d5e6f70819a2b3c4d5e6f70819a3b4c5'
        details_hash:
          type: string
          description: 'keccak256 деталей действия (ADR-0001 §4), 0x-hex 32 байта.'
          example: '0xc73fb7bce1a766808cb4674f3dfb9b8718ef43213408af1d84dd2c79904e313f'
        signer_key_id:
          type: string
          description: 'keyId администратора-подписанта, 0x-hex 32 байта.'
          example: '0x6f1c2a7b3d9e4c8a5b2f0d7e6c1a9b8d4e3f2a1c0b9d8e7f6a5b4c3d2e1f0a9b'
        challenge:
          type: string
          description: 32 байта challenge в base64url без паддинга — их подписывает passkey админа.
          example: 1aB2cD3eF4gH5iJ6kL7mN8oP9qR0sT
        rp_id:
          type: string
          description: Relying Party ID для WebAuthn (из конфигурации WMS).
          example: localhost
        allow_credentials:
          type: array
          items:
            type: object
            required: [type, id]
            properties:
              type:
                type: string
                const: public-key
              id:
                type: string
                description: credential id подписанта в base64url без паддинга.
        user_verification:
          type: string
          const: required
        timeout:
          type: integer
          example: 60000

    # ── Passkeys: WebAuthn приветствия и тела регистрации ────────────────────
    PasskeyCreationOptions:
      type: object
      description: |
        Опции регистрации WebAuthn (`protocol.CredentialCreation` в JSON-виде):
        браузер передаёт `publicKey` в `navigator.credentials.create`.
      required: [publicKey]
      properties:
        publicKey:
          type: object
          additionalProperties: true
          description: 'Аргументы `navigator.credentials.create`; поля go-webauthn, лишние серверные поля возможны.'
          required: [rp, user, challenge, pubKeyCredParams, timeout, authenticatorSelection, attestation]
          properties:
            rp:
              type: object
              required: [id, name]
              properties:
                id:
                  type: string
                  description: RP ID — домен WMS (из конфигурации).
                  example: localhost
                name:
                  type: string
                  description: Отображаемое имя RP.
                  example: WMS
            user:
              type: object
              required: [id, name, displayName]
              properties:
                id:
                  type: string
                  description: user_id пользователя в base64url без паддинга.
                  example: aWNhbmV2ZXItc2lnbg
                name:
                  type: string
                  description: username.
                  example: op-1a2b3c4d
                displayName:
                  type: string
                  example: op-1a2b3c4d
            challenge:
              type: string
              description: Случайные 32+ байта в base64url без паддинга — их подписывает ключ при регистрации.
              example: 5hG2fD0cA9bE8dF7gH6iJ5kL4mN3oPqR0sT
            pubKeyCredParams:
              type: array
              description: 'Допустимые алгоритмы; WMS предлагает только ES256 (alg -7).'
              items:
                type: object
                required: [type, alg]
                properties:
                  type:
                    type: string
                    const: public-key
                    example: public-key
                  alg:
                    type: integer
                    description: 'COSE-код алгоритма; -7 — ES256.'
                    example: -7
            timeout:
              type: integer
              description: Время жизни сессии регистрации в миллисекундах (TTL 5 минут).
              example: 60000
            excludeCredentials:
              type: array
              description: Существующие ключи, которые нельзя использовать; обычно отсутствует (живой ключ один).
              items:
                type: object
                required: [type, id]
                properties:
                  type:
                    type: string
                    const: public-key
                    example: public-key
                  id:
                    type: string
                    description: credential id в base64url без паддинга.
                    example: vEJYj3dHhit9F8qLm0RGjXYkKluWjdI6W_1Lb3tQ6HA
            authenticatorSelection:
              type: object
              required: [residentKey, userVerification]
              properties:
                residentKey:
                  type: string
                  const: preferred
                  example: preferred
                userVerification:
                  type: string
                  const: required
                  example: required
            attestation:
              type: string
              const: none
              example: none
    PasskeyRegistrationResponse:
      type: object
      description: |
        Тело `POST /passkeys/registration/finish` — сырой результат
        `navigator.credentials.create` (`RegistrationResponseJSON`); разбирается
        go-webauthn без `DisallowUnknownFields` (см. описание API), тело до 64 KiB.
      required: [id, rawId, type, response, clientExtensionResults]
      properties:
        id:
          type: string
          description: base64url credential id.
          example: vEJYj3dHhit9F8qLm0RGjXYkKluWjdI6W_1Lb3tQ6HA
        rawId:
          type: string
          description: base64url raw credential id.
          example: vEJYj3dHhit9F8qLm0RGjXYkKluWjdI6W_1Lb3tQ6HA
        type:
          type: string
          const: public-key
          example: public-key
        response:
          type: object
          required: [clientDataJSON, attestationObject, transports]
          properties:
            clientDataJSON:
              type: string
              description: base64url clientDataJSON.
              example: eyJ0eXBlIjoid2ViYXV0aG4uY3JlYXRlIn0
            attestationObject:
              type: string
              description: base64url CBOR-attestation.
              example: o2NmbXRpb25lLXN0emlwYXRpb25Ob25lZ2F0dFN0bXQ
            transports:
              type: array
              description: Транспорта authenticator'а (может быть пустым).
              items:
                type: string
                example: internal
        clientExtensionResults:
          type: object
          additionalProperties: true
          description: Результаты client-extensions браузера.
        authenticatorAttachment:
          type: string
          description: '`platform` или `cross-platform`, если браузер сделал вывод.'
          example: platform

    # ── Подписанные действия: статус операции ─────────────────────────────────
    OperationStatus:
      type: object
      description: Тело `data` в ответе `GET /signed-actions/operations/{operation_id}`.
      required: [operation_id, parts]
      properties:
        operation_id:
          type: string
          format: uuid
        parts:
          type: array
          description: По одной на каждое действие операции, в порядке `part_index`.
          items:
            $ref: '#/components/schemas/OperationPartStatus'
    OperationPartStatus:
      type: object
      description: Состояние одной части операции в цепи.
      required: [action_id, state, reject_reason]
      properties:
        action_id:
          type: string
          format: uuid
        state:
          $ref: '#/components/schemas/ConfirmationState'
        reject_reason:
          type: [integer, 'null']
          description: |
            Код причины отклонения (ADR-0001 §6): 1 UnknownKey, 2 KeyRevoked,
            3 BadSignature, 4 WrongType, 5 NotAdmin, 6 KeyExists,
            7 InvalidPublicKey, 8 WrongOrganization, 9 TargetNotOperator,
            10 EmptyItems, 11 ItemsNotAscending, 12 WrongItemStatus;
            `null`, пока никаких отклонений нет.

    # ── Products: read-only лента и таймлайн ──────────────────────────────
    RecentProduct:
      type: object
      description: Одна строка списка `GET /products/recent`.
      required: [product_id, qr_code, sku_name, status, updated_at]
      properties:
        product_id:
          type: string
          format: uuid
        qr_code:
          type: string
          example: QR-E2E-1a2b3c4d
        sku_name:
          type: string
          example: Товар 1
        status:
          $ref: '#/components/schemas/ProductStatus'
        updated_at:
          type: string
          format: date-time
          example: '2026-05-31T12:00:00Z'
    ProductHeader:
      type: object
      description: Шапка товара в таймлайне.
      required: [product_id, qr_code, sku_name, status]
      properties:
        product_id:
          type: string
          format: uuid
        qr_code:
          type: string
          example: QR-E2E-1a2b3c4d
        sku_name:
          type: string
          example: Товар 1
        status:
          $ref: '#/components/schemas/ProductStatus'
    TimelineStep:
      type: object
      description: |
        Шаг таймлайна: подписанное действие с товаром + статус его события в цепи.
        `stage` — нижний регистр `aggregate_type`; фронт мапит его в label этапа.
      required: [stage, event_type, occurred_at, event_id, tx_hash, chain_status, chain_updated_at, error_message]
      properties:
        stage:
          type: string
          enum: [receiving, putaway, picking, shipping]
          description: Этап действия (lowercase aggregate_type).
        event_type:
          type: string
          description: Тип outbox-события (в текущем коде `wms.action.v1`).
          example: wms.action.v1
        occurred_at:
          type: string
          format: date-time
          description: Время события (`outbox_events.created_at`).
          example: '2026-05-31T10:20:00Z'
        event_id:
          type: string
          format: uuid
          description: id события — `action_id` части операции.
        tx_hash:
          type: [string, 'null']
          description: Хеш транзакции цепи, задан при отправке; `null`, пока нет.
          example: '0x2be804dde1e3a1578819c47b5f8e0e31f3a10c7b4d5e6f708192a3b4c5d6e7f80'
        chain_status:
          type: string
          enum: [PENDING, SENT, COMMITTED, FAILED]
          description: Статус события в `onchain_events`; отсутствующая строка читается как `PENDING`.
        chain_updated_at:
          type: [string, 'null']
          format: date-time
          description: Время последнего обновления статуса в `onchain_events`; `null`, пока строки нет.
        error_message:
          type: [string, 'null']
          description: 'Сообщение об ошибке при `FAILED`; иначе `null`.'
    ProductTimeline:
      type: object
      description: Тело `data` в ответе `GET /products/timeline`.
      required: [product, steps]
      properties:
        product:
          $ref: '#/components/schemas/ProductHeader'
        steps:
          type: array
          description: Может быть пустым — товар есть, событий в цепи ещё нет.
          items:
            $ref: '#/components/schemas/TimelineStep'

    # ── Audit: аудит товара (camelCase) ───────────────────────────────────────
    ProductAudit:
      type: object
      description: 'Тело `data` в ответе `GET /audit/products/{key}` (`productAuditView`); camelCase — единственное исключение из snake_case вместе с `AdminKeyExport`.'
      required: [productId, itemId, actions]
      properties:
        productId:
          type: string
          format: uuid
        itemId:
          type: string
          description: 'itemID товара в цепи — keccak256(product_id), 0x-hex 32 байта.'
          example: '0x3d2a91c4e8b7f6a5d4c3b2a1908f7e6d5c4b3a2918f7e6d5c4b3a2918f7e6d5c'
        actions:
          type: array
          description: Подписанные действия с товаром (в порядке чтения из БД).
          items:
            $ref: '#/components/schemas/AuditAction'
    AuditAction:
      type: object
      description: Одно отправленное подписанное действие (`actionView`) с salt и деталями.
      required: [actionId, operationId, partIndex, actionType, itemIds, salt, submittedAt, operatorId, operator, keyOwnerId, orgId, orgName, keyId, chainStatus, rejectReason, details, detailsError]
      properties:
        actionId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        partIndex:
          type: integer
          description: Номер части в операции (с 0).
        actionType:
          type: integer
          description: 'код действия (ADR-0001): 1 Receive, 2 PutAway, 3 Pick, 4 Ship; 5/6 — ключевые действия.'
        itemIds:
          type: array
          description: Товары действия (из строки действия, в порядке хранения).
          items:
            type: string
            format: uuid
        salt:
          type: string
          description: 'Salt подписи (ADR-0001 §4), 0x-hex 32 байта.'
          example: '0xdf6c6b77628a0141ae15ae06213f0ded61ed1c0b1de212880a67bbd897aa2da7'
        submittedAt:
          type: string
          format: date-time
          description: Момент приёма подписи (RFC3339Nano).
          example: '2026-05-31T10:20:05.123456Z'
        operatorId:
          type: string
          format: uuid
          description: user_id оператора (`warehouse_actions.created_by`).
        operator:
          type: string
          description: Имя оператора (`users.username`).
        keyOwnerId:
          type: string
          format: uuid
          description: Собственник ключа подписанта (`passkey_credentials.user_id`).
        orgId:
          type: string
          format: uuid
          description: Организация ключа подписанта.
        orgName:
          type: string
        keyId:
          type: string
          description: 'keyId подписанта, 0x-hex 32 байта.'
          example: '0x6f1c2a7b3d9e4c8a5b2f0d7e6c1a9b8d4e3f2a1c0b9d8e7f6a5b4c3d2e1f0a9b'
        chainStatus:
          type: string
          description: 'Статус события в `onchain_events` (`PENDING`/`SENT`/`COMMITTED`/`FAILED`); пустая строка — событие ещё не в цепи.'
        rejectReason:
          type: [integer, 'null']
          description: 'Код причины отклонения (ADR-0001 §6); `null`, пока отклонений нет.'
        details:
          description: 'Детали (`detailsView`), пересчитанные из доменных таблиц; `null` с `detailsError` при испорченных строках домена.'
          oneOf:
            - $ref: '#/components/schemas/AuditDetails'
            - type: 'null'
        detailsError:
          description: '`DOMAIN_ROW_MISSING` (строки нет) или `DOMAIN_INCONSISTENT` (строки расходятся); `null`, если детали пересчитаны.'
          oneOf:
            - type: string
              enum: [DOMAIN_ROW_MISSING, DOMAIN_INCONSISTENT]
            - type: 'null'
    AuditDetails:
      type: object
      description: |
        Детали действия (`detailsView`), пересчитанные из доменных таблиц WMS.
        Поля, не относящиеся к типу действия, не отдаются — аудитор видит ровно
        тот набор, что был подписан (ADR-0001 §4).
      required: [operatorId, occurredAtMs]
      properties:
        cargoplaceId:
          type: string
          format: uuid
          description: 'Только action_type 1 (Receive).'
        storageBinId:
          type: string
          format: uuid
          description: 'Только action_type 2 (PutAway).'
        shippingBufferBinId:
          type: string
          format: uuid
          description: 'Только action_type 3 (Pick) и 4 (Ship).'
        dispatchId:
          type: string
          format: uuid
          description: 'Только action_type 4 (Ship); водитель в детали не входит (ADR-0001).'
        orderIds:
          type: array
          description: 'Только action_type 3 (Pick) и 4 (Ship); пустой список — заказов нет.'
          items:
            type: string
            format: uuid
        operatorId:
          type: string
          format: uuid
        occurredAtMs:
          type: integer
          format: int64
          description: 'Момент подписи (мс, Unix) — из подписанных деталей.'
