      description: |
        RBAC: только `OPERATOR`. Проверяет подписи всех частей и в одной транзакции
        переводит товары `RECEIVED → STORED`, пишет `wms_ops.putaways` (у строки —
        `action_id` своей части) и **по строке `outbox_events` на каждую часть**
        (`aggregate_type=signed_action`, `event_type=wms.action.v1`). Chain-gate
        (`FAILED` receiving) повторяется на подписанном наборе, поэтому между
        черновиком и submit возможен `409 CHAIN_EVENT_REJECTED`. Если состав корзины
        изменился — `409 DRAFT_STALE`. `outbox_events_created` считает части-действия,
        а не товары.
      operationId: putawayScanStorageBinSubmit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedActionSubmitRequest'
            example:
              operation_id: 01929c5e-6f00-7000-8000-000000002001
              assertions:
                - action_id: 01929c5e-6f00-7000-8000-000000002002
                  credential_id: pQECAyYgASFYIB
                  authenticator_data: ZmxhZ3M
                  client_data_json: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0In0
                  signature: MEUCIQD
      responses:
        '200':
          description: Товары размещены, по строке outbox на каждую часть операции.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScanStorageBinResponse'
              example:
                success: true
                data:
                  storage_bin_id: 77777777-7777-7777-7777-777777777777
                  storage_bin_code: M2-A-03
                  products_placed: 3
                  outbox_events_created: 1
                  operation_id: 01929c5e-6f00-7000-8000-000000002001
                error: null
        '400':
          description: '`INVALID_REQUEST` (битый JSON, не-UUID) или `INVALID_ASSERTION` (подпись части не прошла проверку).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`OPERATION_NOT_FOUND`, `STORAGE_BIN_NOT_FOUND` или `PRODUCT_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `OPERATION_ALREADY_SUBMITTED`, `DRAFT_STALE` (товар ушёл из буфера или сменил
            статус), `PRODUCT_NOT_IN_BUFFER`, `PRODUCT_NOT_RECEIVED`,
            `CHAIN_EVENT_REJECTED` или `SIGNER_KEY_NOT_ACTIVE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/JSONInternal'

  # ──────────────────────────────────────────────────────────────────────────
  # ASSEMBLY
  # ──────────────────────────────────────────────────────────────────────────
  /assembly/allocate:
    post:
      tags: [Assembly]
      summary: Аллоцировать товары на заказы пункта назначения
      description: |
        **RBAC: `ADMIN` или `OPERATOR`** (issue #39 — единственная операция, доступная
        ADMIN, кроме `/auth/register`). Аллоцирует `STORED` товары на `NEW` заказы
        пункта назначения (all-or-nothing на заказ), создаёт `assembly_tasks` (PENDING).
        Недоаллоцированные заказы возвращаются в `insufficient_orders` — это **не ошибка**,
        ответ всегда `200`. См. `../flows/assembly-flow.md`.
      operationId: assemblyAllocate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocateRequest'
            example:
              destination_id: 88888888-8888-8888-8888-888888888888
      responses:
        '200':
          description: Аллокация выполнена (возможно частично — см. insufficient_orders).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AllocateResponse'
              examples:
                full:
                  summary: Полная аллокация
                  value:
                    success: true
                    data: { allocated_orders: 1, allocated_products: 3, insufficient_orders: [] }
                    error: null
                shortage:
                  summary: Нехватка остатка
                  value:
                    success: true
                    data:
                      allocated_orders: 0
                      allocated_products: 0
                      insufficient_orders:
                        - order_id: 99999999-9999-9999-9999-999999999999
                          missing_skus:
                            - sku_id: 33333333-3333-3333-3333-333333333333
                              sku_name: E2E MP SKU 1a2b3c4d
                              missing_qty: 2
                    error: null
        '400':
          $ref: '#/components/responses/JSONBadRequest'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          description: '`FORBIDDEN` — роль не ADMIN и не OPERATOR (например CUSTOMER).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: FORBIDDEN, message: Требуется роль администратора или оператора }
        '409':
          description: >-
            `ORDER_NOT_NEW` — гонка конкурентных аллокаций: заказ уже вышел из статуса
            `NEW` (редкий случай при параллельных запросах; см. assembly/repository.go
            UpdateOrderStatus → RowsAffected()==0).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: ORDER_NOT_NEW, message: Заказ не в статусе NEW }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /assembly/tasks:
    get:
      tags: [Assembly]
      summary: Получить список задач сборки
      description: |
        RBAC: только `OPERATOR`. Только чтение. Фильтр `operator_id` (опционально):
        возвращает задачи `operator_id IS NULL OR operator_id = $`. Задачи отсортированы
        по `section, code` ячейки.
      operationId: assemblyGetTasks
      parameters:
        - name: destination_id
          in: query
          required: true
          description: UUID пункта назначения. Обязателен.
          schema:
            type: string
            format: uuid
        - name: operator_id
          in: query
          required: false
          description: Опциональный UUID оператора. Если опущен — фильтр по оператору не применяется.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: 'Статус задачи. По умолчанию `PENDING`.'
          schema:
            allOf:
              - $ref: '#/components/schemas/TaskStatus'
              - default: PENDING
      responses:
        '200':
          description: Список задач (может быть пустым массивом).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TaskResponse'
              example:
                success: true
                data:
                  tasks:
                    - task_id: aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa
                      product_id: 55555555-5555-5555-5555-555555555555
                      qr_code: QR-E2E-1a2b3c4d
                      sku_name: Ноутбук Lenovo X1
                      from_bin_code: M2-A-03
                      from_bin_section: A
                      order_no: EXT-ORDER-001
                error: null
        '400':
          description: '`INVALID_REQUEST` — отсутствует/невалиден destination_id, невалиден operator_id или неизвестный status.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '500':
          $ref: '#/components/responses/JSONInternal'

  /assembly/pick:
    post:
      tags: [Assembly]
      summary: Подобрать товар (зафиксировать пик)
      description: |
        RBAC: только `OPERATOR`. Помечает задачу `DONE`, товар `ASSEMBLED`. **Outbox не
        пишется**: Pick-действие уходит в цепь при выгрузке корзины в буфер отгрузки
        (`POST /assembly/scan-shipping-buffer/submit`).
        Перед транзакцией — chain-gate по putaway-стадии: `FAILED` → `409 CHAIN_EVENT_REJECTED`.
        `cart_size` — кол-во ASSEMBLED товаров оператора с DONE-задачами.
      operationId: assemblyPick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickRequest'
            example:
              product_id: 55555555-5555-5555-5555-555555555555
      responses:
        '200':
          description: Товар подобран.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PickResponse'
              example:
                success: true
                data: { product_id: 55555555-5555-5555-5555-555555555555, cart_size: 1 }
                error: null
        '400':
          $ref: '#/components/responses/JSONBadRequest'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '409':
          description: |
            `CHAIN_EVENT_REJECTED` (FAILED putaway on-chain), `NO_TASK_FOR_PRODUCT`
            (нет PENDING-задачи) или `PRODUCT_NOT_ALLOCATED` (статус ≠ ALLOCATED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: NO_TASK_FOR_PRODUCT, message: Нет задачи сборки для этого товара }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /assembly/scan-shipping-buffer/draft:
    post:
      tags: [Assembly]
      summary: Черновик подписанной выгрузки корзины в буфер отгрузки
      description: |
        RBAC: только `OPERATOR`. Читает корзину оператора (товары `ASSEMBLED` с
        DONE-задачей под назначение буфера), сортирует их по `itemId`, режет операцию на
        части по ≤ 2000 товаров (ADR-0001 §10) и пишет только черновик — по строке
        `warehouse_actions` на часть. Ничего в товарах не меняет. Подписи частей
        отправляются в `POST /assembly/scan-shipping-buffer/submit`: там товары переходят
        в `READY_TO_SHIP`, а в цепь уходит Pick-действие (`PutAway → Picked`).
      operationId: assemblyScanShippingBufferDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssemblyScanShippingBufferRequest'
            example:
              buffer_bin_id: bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb
      responses:
        '200':
          description: Черновик создан — `operation_id` и части с `challenge`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SignedActionDraft'
              example:
                success: true
                data:
                  operation_id: 01929c5e-6f00-7000-8000-000000003001
                  action_type: 3
                  signer_key_id: '0x6f1c2a7b3d9e4c8a5b2f0d7e6c1a9b8d4e3f2a1c0b9d8e7f6a5b4c3d2e1f0a9b'
                  rp_id: localhost
                  allow_credentials:
                    - type: public-key
                      id: pQECAyYgASFYIB
                  user_verification: required
                  timeout: 60000
                  parts:
                    - action_id: 01929c5e-6f00-7000-8000-000000003002
                      item_ids:
                        - 55555555-5555-5555-5555-555555555555
                      details_hash: '0x4c3b2a1908f7e6d5c4b3a2918f7e6d5c4b3a2918f7e6d5c4b3a2918f7e6d5c4b'
                      challenge: 0zY9xW8vU7tS6rQ5pO4nM3lK2jI1hG
                error: null
        '400':
          description: '`INVALID_REQUEST` (битый JSON, не-UUID) или `BIN_NOT_SHIPPING_BUFFER` (ячейка не найдена или `section ≠ SHIPPING_BUFFER`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: BIN_NOT_SHIPPING_BUFFER, message: Ячейка не является буфером отгрузки }
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`DESTINATION_NOT_FOUND` — у SHIPPING_BUFFER-ячейки нет `destination_id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `CART_EMPTY` — у оператора нет ASSEMBLED товаров для этого назначения.
            `DESTINATION_MISMATCH` — оператор несёт товары, собранные под другой магазин,
            и отсканировал чужой буфер: ни один товар не перемещён.
            `SIGNER_KEY_NOT_ACTIVE` — у оператора нет активного в реестре passkey.
            См. `../flows/assembly-flow.md`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                cartEmpty:
                  summary: Корзина пуста
                  value:
                    success: false
                    data: null
                    error: { code: CART_EMPTY, message: Корзина оператора пуста }
                destinationMismatch:
                  summary: Чужой буфер магазина
                  value:
                    success: false
                    data: null
                    error: { code: DESTINATION_MISMATCH, message: 'Буфер отгрузки другого магазина: собранные товары не для этого пункта назначения' }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /assembly/scan-shipping-buffer/submit:
    post:
      tags: [Assembly]
      summary: Принять подписи частей и выгрузить корзину в буфер отгрузки
      description: |
        RBAC: только `OPERATOR`. Проверяет подписи всех частей и в одной транзакции
        перемещает товары корзины в `SHIPPING_BUFFER` (`READY_TO_SHIP`), проставляет
        задачам сборки `action_id` части и `unloaded_at`, переводит полностью собранные
        заказы в `ASSEMBLED` и пишет **по строке `outbox_events` на каждую часть**
        (`aggregate_type=signed_action`, `event_type=wms.action.v1`). В цепи это
        Pick-действие: `SignedMappingWMS.applyActions`, FSM на каждый товар
        `PutAway → Picked`. Подбор с полки (`/assembly/pick`) в цепь не пишет.
      operationId: assemblyScanShippingBufferSubmit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedActionSubmitRequest'
            example:
              operation_id: 01929c5e-6f00-7000-8000-000000003001
              assertions:
                - action_id: 01929c5e-6f00-7000-8000-000000003002
                  credential_id: pQECAyYgASFYIB
                  authenticator_data: ZmxhZ3M
                  client_data_json: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0In0
                  signature: MEUCIQD
      responses:
        '200':
          description: Товары в буфере отгрузки, по строке outbox на каждую часть операции.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScanShippingBufferResponse'
              example:
                success: true
                data:
                  buffer_bin_id: bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb
                  products_placed: 4
                  orders_assembled: 1
                  operation_id: 01929c5e-6f00-7000-8000-000000003001
                error: null
        '400':
          description: '`INVALID_REQUEST` (битый JSON, не-UUID), `INVALID_ASSERTION` (подпись части не прошла проверку) или `BIN_NOT_SHIPPING_BUFFER`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`OPERATION_NOT_FOUND` или `DESTINATION_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `OPERATION_ALREADY_SUBMITTED`, `DRAFT_STALE` (состав корзины изменился после
            подписи) или `SIGNER_KEY_NOT_ACTIVE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/JSONInternal'

  # ──────────────────────────────────────────────────────────────────────────
  # DISPATCHES
  # ──────────────────────────────────────────────────────────────────────────
  /destinations:
    get:
      tags: [Destinations]
      summary: Список магазинов-получателей
      description: |
        RBAC: только `OPERATOR`. Read-only справочник для выбора магазина в UI
        сборки. Фильтр `warehouse_id` опционален (при отсутствии — все склады).
        Пустой результат отдаёт `{"destinations": []}` (никогда не `null`).
        Работают оба пути: `/destinations` и `/destinations/`.
      operationId: destinationsList
      parameters:
        - name: warehouse_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 'Массив магазинов в `data.destinations`.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/DestinationListResponse'
              example:
                success: true
                data:
                  destinations:
                    - destination_id: 88888888-8888-8888-8888-888888888888
                      code: SHOP-5
                      name: Магазин №5 Маросейка
                      address: 'г. Москва, ул. Маросейка, 5'
                      warehouse_id: 1
                error: null
        '400':
          description: '`INVALID_REQUEST` — `warehouse_id` передан, но не число.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: INVALID_REQUEST, message: warehouse_id должен быть числом }
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '500':
          $ref: '#/components/responses/JSONInternal'

  /analytics/summary:
    get:
      tags: [Analytics]
      summary: Сводные показатели склада
      description: |
        RBAC: `ADMIN` или `OPERATOR`. Read-only агрегаты по статусам товаров,
        заказов и рейсов плюс итоговые счётчики. `events_today` — число outbox-событий
        с начала суток. Работают оба пути: `/analytics/summary` и `/analytics/summary/`.
      operationId: analyticsSummary
      responses:
        '200':
          description: 'Сводка в `data`.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AnalyticsSummaryResponse'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '500':
          $ref: '#/components/responses/JSONInternal'

  /analytics/onchain:
    get:
      tags: [Analytics]
      summary: Статус событий в блокчейне
      description: |
        RBAC: `ADMIN` или `OPERATOR`. Агрегаты подтверждения событий аудита в сети.
        `confirmation_rate` = COMMITTED / `total_events` (на уровне событий, диапазон
        0..1), где `total_events` — число outbox-событий (события КПП on-chain не
        пишутся). `pending` = total − committed − sent − failed (включая события, ещё
        не попавшие в `onchain_events`). Списки `recent_failed`/`recent_committed`
        ограничены 10. Работают оба пути: `/analytics/onchain` и `/analytics/onchain/`.
      operationId: analyticsOnchain
      responses:
        '200':
          description: 'Статус блокчейн-аудита в `data`.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AnalyticsOnchainResponse'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '500':
          $ref: '#/components/responses/JSONInternal'

  /analytics/throughput:
    get:
      tags: [Analytics]
      summary: Поток событий по дням
      description: |
        RBAC: `ADMIN` или `OPERATOR`. Объём outbox-событий по дням и этапам за
        трейлинг-окно. `days` — 1..90 (по умолчанию 14). Ось `days` непрерывная
        (без пропусков), `series[].counts` и `totals` позиционно с ней выровнены.
        Работают оба пути: `/analytics/throughput` и `/analytics/throughput/`.
      operationId: analyticsThroughput
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 14
      responses:
        '200':
          description: 'Временной ряд в `data`.'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AnalyticsThroughputResponse'
        '400':
          description: '`INVALID_REQUEST` — `days` не число или вне диапазона 1..90.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '500':
          $ref: '#/components/responses/JSONInternal'

  /dispatches/:
    get:
      tags: [Dispatches]
      summary: Список исходящих рейсов
      description: |
        RBAC: только `OPERATOR`. **Завершающий слэш обязателен** (gorilla/mux не
        редиректит). Все фильтры опциональны. Внутренние ошибки отдают `503`.
        Внимание: при пустом результате `data` может быть `null`, а не `[]`.
      operationId: dispatchesList
      parameters:
        - name: status
          in: query
