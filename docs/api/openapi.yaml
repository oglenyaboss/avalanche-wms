      responses:
        '200':
          description: Черновик создан — материалы для подписи браузером админа.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/KeyActionDraft'
              example:
                success: true
                data:
                  action_id: 01929c5e-6f00-7000-8000-000000006001
                  action_type: 6
                  item_ids: []
                  subject_key:
                    qx: '0x7fa09e1c2b3c4d5e6f708192a3b4c5d6e7f809a1b2c3d4e5f60718293a4b5c6d'
                    qy: '0x8fa09e0d1c2b3a4c5d6e7f8091a2b3c4d5e6f70819a2b3c4d5e6f70819a3b4c5'
                  details_hash: '0x3963d0526975670e66220bdc41fc669d8723df76d07b3f530eaa64c55afc7abf'
                  signer_key_id: '0x6f1c2a7b3d9e4c8a5b2f0d7e6c1a9b8d4e3f2a1c0b9d8e7f6a5b4c3d2e1f0a9b'
                  challenge: 0zY9xW8vU7tS6rQ5pO4nM3lK2jI1hG
                  rp_id: localhost
                  allow_credentials:
                    - type: public-key
                      id: aGFzaC1hZG1pbi1rZXk
                  user_verification: required
                  timeout: 60000
                error: null
        '400':
          description: '`INVALID_REQUEST` — битый JSON или неверный формат `target_key_id` (`0x` + 64 hex).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: INVALID_REQUEST, message: Некорректный запрос }
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          description: |
            `FORBIDDEN` — роль не `ADMIN` (RBAC-гейт), или `NO_ORGANIZATION` —
            пользователь не принадлежит организации (сервис passkeys).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: FORBIDDEN, message: Только администратор может выполнять это действие }
        '404':
          description: '`PASSKEY_NOT_FOUND` — нет ключа админа, цель не найдена, она в другой организации или не ключ оператора.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: PASSKEY_NOT_FOUND, message: Ключ не найден }
        '409':
          description: |
            `TARGET_NOT_ACTIVE` — целевой ключ не `ACTIVE`,
            `SIGNER_KEY_NOT_ACTIVE` — ключ подписанта не `ACTIVE` в реестре цепи,
            `ACTION_IN_PROGRESS` — последнее действие целевого ключа ещё в полёте (`SENT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: TARGET_NOT_ACTIVE, message: Ключ оператора не активен в реестре }
        '503':
          description: '`REGISTRY_UNAVAILABLE` — реестр цепи не ответил при проверке ключа подписанта; ничего не подписывается. Повторите позже.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: REGISTRY_UNAVAILABLE, message: 'Реестр недоступен, повторите позже' }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /passkeys/actions/{action_id}/submit:
    post:
      tags: [SignedActions]
      summary: Отправить ключевое действие в цепь (подпись админа)
      description: |
        RBAC: только `ADMIN`. Проверяет WebAuthn-assertion над challenge черновика
        (браузер подписывает по `allow_credentials` ответа draft; все поля тела —
        base64url без паддинга, как их отдаёт `navigator.credentials.get`), тело
        ограничено 16 KiB. Успех: `submitted_at`, **строка `outbox_events`
        (ADR-0001 §9)** и `state=SENT` в ответе — дальше статус в цепи виден как
        `confirmation` в `GET /passkeys/organization` (`onchain_events` ->
        `APPLIED`/`REJECTED`/`FAILED`). Действие доступно только его автору:
        черновик другого админа — `404 ACTION_NOT_FOUND`.
      operationId: passkeysActionSubmit
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnAssertion'
            example:
              credential_id: aGFzaC1hZG1bi1rZXk
              authenticator_data: TLkAxdzUh_5QoqvizgHY4sQ0v6X-Vj1UVVeC2mEcqFbC8O8yAAAAAQ
              client_data_json: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0In0
              signature: MEUCIQDx2jZVv6nT3W8M_yUc9dY4hA
      responses:
        '200':
          description: Подпись верна, действие отправлено в outbox; `data.state` пока `SENT`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/KeyConfirmation'
              example:
                success: true
                data:
                  action_id: 01929c5e-6f00-7000-8000-000000005001
                  action_type: 5
                  state: SENT
                  reject_reason: null
                error: null
        '400':
          description: |
            `INVALID_REQUEST` — битый JSON, не-UUID `action_id`, невалидный base64url в теле,
            или `INVALID_ASSERTION` — подпись не сошлась с challenge/ключом админа (или
            assertion от другого ключа).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: INVALID_ASSERTION, message: Подтверждение не прошло проверку }
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          description: |
            `FORBIDDEN` — роль не `ADMIN` (RBAC-гейт), или `NO_ORGANIZATION` —
            пользователь не принадлежит организации (сервис passkeys).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: FORBIDDEN, message: Только администратор может выполнять это действие }
        '404':
          description: |
            `ACTION_NOT_FOUND` — действие не существует или создано другим админом
            (черновик доступен только автору), или `PASSKEY_NOT_FOUND` — строка ключа
            не найдена к моменту submit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: ACTION_NOT_FOUND, message: Действие не найдено }
        '409':
          description: '`ACTION_ALREADY_SUBMITTED` — действие уже отправлено в цепь.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: ACTION_ALREADY_SUBMITTED, message: Действие уже отправлено }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /signed-actions/operations/{operation_id}:
    get:
      tags: [SignedActions]
      summary: Статус подтверждения частей подписанной операции
      description: |
        RBAC: `ADMIN` или `OPERATOR`. Состояние каждой части подписанной операции
        (`warehouse_actions` + `onchain_events`), в порядке `part_index`. Статус
        выводится именно из `onchain_events`: строки нет (или `PENDING`/`SENT`) —
        `SENT`, `COMMITTED` — `APPLIED`, `FAILED` с `reject_reason` — `REJECTED`,
        `FAILED` без причины — `FAILED`. Поле `reject_reason` — коды ADR-0001 §6:
        1 UnknownKey, 2 KeyRevoked, 3 BadSignature, 4 WrongType, 5 NotAdmin,
        6 KeyExists, 7 InvalidPublicKey, 8 WrongOrganization, 9 TargetNotOperator,
        10 EmptyItems, 11 ItemsNotAscending, 12 WrongItemStatus.
        Клиент опрашивает этот статус, пока хотя бы одна часть ещё `SENT`.
        Операция должна быть отправлена (`submit`): черновик отдаёт
        `409 OPERATION_NOT_SUBMITTED`. Операция видна только её автору:
        чужая — тоже `404` (фильтр по `created_by`).
      operationId: signedActionsOperationStatus
      parameters:
        - name: operation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Статус подтверждения каждой части в `data`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/OperationStatus'
              example:
                success: true
                data:
                  operation_id: 01929c5e-6f00-7000-8000-000000002001
                  parts:
                    - action_id: 01929c5e-6f00-7000-8000-000000002002
                      state: APPLIED
                      reject_reason: null
                    - action_id: 01929c5e-6f00-7000-8000-000000002003
                      state: REJECTED
                      reject_reason: 12
                error: null
        '400':
          description: '`INVALID_REQUEST` — `operation_id` не UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: INVALID_REQUEST, message: Некорректный запрос }
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: |
            `OPERATION_NOT_FOUND` — операции нет и, в том числе, когда она существует,
            но была создана другим пользователем (фильтр по `created_by`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: OPERATION_NOT_FOUND, message: Операция не найдена }
        '409':
          description: '`OPERATION_NOT_SUBMITTED` — операция ещё не отправлена в цепь (нет `submit`).' 
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: OPERATION_NOT_SUBMITTED, message: Операция ещё не отправлена }
        '500':
          $ref: '#/components/responses/JSONInternal'

  # ──────────────────────────────────────────────────────────────────────────
  # PRODUCTS
  # ──────────────────────────────────────────────────────────────────────────
  /products/recent:
    get:
      tags: [Products]
      summary: Список последних изменённых товаров
      description: |
        RBAC: `ADMIN` или `OPERATOR`. Товары по убыванию `updated_at` с названием
        SKU. `limit`: нечисловое значение, 0 или меньше — игнорируется (по умолчанию
        20), больше 50 — обрезается до 50, так что `400` здесь невозможен.
        Работают оба пути: `/products/recent` и `/products/recent/`.
      operationId: productsRecent
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Массив товаров в `data` (может быть пустым).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RecentProduct'
              example:
                success: true
                data:
                  - product_id: 55555555-5555-5555-5555-555555555555
                    qr_code: QR-E2E-1a2b3c4d
                    sku_name: Товар 1
                    status: STORED
                    updated_at: '2026-05-31T12:00:00Z'
                  - product_id: 0f9f2f55-6666-4517-bd23-feb0f37a1eb0
                    qr_code: QR-E2E-9f8e7d6c
                    sku_name: Товар 2
                    status: RECEIVED
                    updated_at: '2026-05-31T11:30:00Z'
