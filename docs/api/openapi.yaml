          $ref: '#/components/responses/JSONInternal'

  # ──────────────────────────────────────────────────────────────────────────
  # AUDIT
  # ──────────────────────────────────────────────────────────────────────────
  /audit/products/{key}:
    get:
      tags: [Audit]
      summary: Аудит товара (подписанные действия)
      description: |
        RBAC: `AUDITOR` или `ADMIN`. Товар (`key` — uuid или QR-код) с полной историей
        **отправленных подписанных действий** с ним: salt, оператор, ключ подписанта,
        статус в цепи — плюс детали, пересчитанные из доменных таблиц WMS (issue #18 —
        только БД и salt, данные из цепи не возвращаются). `itemId` — itemID товара в
        цепи (keccak256(product_id), `0x`-hex 32 байта). `details` содержит ровно те
        поля, которые были подписаны именно этим типом действия, а при испорченных
        доменных строках становится `null` с кодом в `detailsError`:
        `DOMAIN_ROW_MISSING` (строка отсутствует) или `DOMAIN_INCONSISTENT`
        (строки расходятся). Ответ — **camelCase** (вместе с `AdminKeyExport` —
        единственное исключение из snake_case).
      operationId: auditProduct
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Аудит товара в `data` (camelCase; `actions` может быть пустым).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
