  /passkeys/actions/key-register/draft:
    post:
      tags: [SignedActions]
      summary: Черновик действия KeyRegister (action_type 5)
      description: |
        RBAC: только `ADMIN`. Создаёт черновик подтверждения `PENDING`-ключа оператора
        своей организации (`action_type` 5) и пишет его в `key_actions`. Подписывает
        активный ключ админа: реестр цепи подтверждает его `ACTIVE` прямо на старте
        черновика — иначе `409` или `503`; challenge в ответе подписывает браузер админа
        (`navigator.credentials.get` по `allow_credentials[0].id`). `item_ids`
        у ключевых действий всегда пуст. Подтверждение отдаёт
        `POST /passkeys/actions/{action_id}/submit`.
      operationId: passkeysKeyRegisterDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TargetKeyRequest'
            example:
              target_key_id: '0xd2c3a11f6c8e5b79032877a4f2b0a6d5c4e7f8091a2b45678cddbb99eeff01278'
      responses:
        '200':
          description: Черновик создан — материалы для подписи браузером админа.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/KeyActionDraft'
              example:
                success: true
                data:
                  action_id: 01929c5e-6f00-7000-8000-000000005001
                  action_type: 5
                  item_ids: []
                  subject_key:
                    qx: '0x7fa09e1c2b3c4d5e6f708192a3b4c5d6e7f809a1b2c3d4e5f60718293a4b5c6d'
                    qy: '0x8fa09e0d1c2b3a4c5d6e7f8091a2b3c4d5e6f70819a2b3c4d5e6f70819a3b4c5'
                  details_hash: '0xc73fb7bce1a766808cb4674f3dfb9b8718ef43213408af1d84dd2c79904e313f'
                  signer_key_id: '0x6f1c2a7b3d9e4c8a5b2f0d7e6c1a9b8d4e3f2a1c0b9d8e7f6a5b4c3d2e1f0a9b'
                  challenge: 1aB2cD3eF4gH5iJ6kL7mN8oP9qR0sT
                  rp_id: localhost
                  allow_credentials:
                    - type: public-key
                      id: aGFzaC1hZG1pbi1rZXk
                  user_verification: required
                  timeout: 60000
                error: null
        '400':
          description: '`INVALID_REQUEST` — битый JSON или неверный формат `target_key_id` (`0x` + 64 hex).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: INVALID_REQUEST, message: Некорректный запрос }
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          description: |
            `FORBIDDEN` — роль не `ADMIN` (RBAC-гейт), или `NO_ORGANIZATION` —
            пользователь не принадлежит организации (сервис passkeys).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: FORBIDDEN, message: Только администратор может выполнять это действие }
        '404':
          description: '`PASSKEY_NOT_FOUND` — нет ключа админа, цель не найдена, она в другой организации или не ключ оператора.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: PASSKEY_NOT_FOUND, message: Ключ не найден }
        '409':
          description: |
