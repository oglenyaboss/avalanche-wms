        '403':
          $ref: '#/components/responses/JSONForbidden'
        '500':
          $ref: '#/components/responses/JSONInternal'

  /products/timeline:
    get:
      tags: [Products]
      summary: Таймлайн товара со статусами цепи
      description: |
        RBAC: `ADMIN` или `OPERATOR`. Хронология всех подписанных действий с товаром
        (`warehouse_actions.item_ids`), каждое со своим статусом подтверждения в цепи,
        по возрастанию времени; повтор этапа (пере-раскладка) возвращается как есть.
        `key` — `product_id` (UUID) или QR-код. `stage` — нижний регистр
        `aggregate_type` (`receiving`, `putaway`, `picking`, `shipping`). Событий нет —
        тоже `200` с пустым `steps`. Работают оба пути: `/products/timeline` и
        `/products/timeline/`.
      operationId: productsTimeline
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Шапка товара и шаги в `data`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
