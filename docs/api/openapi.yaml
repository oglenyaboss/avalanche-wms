openapi: 3.1.0

info:
  title: WMS API
  version: 1.0.0
  description: |
    REST API склад­ской системы (WMS-монолит на Go). Покрывает пять этапов жизненного
    цикла товара: **Приёмка на КПП → Приёмка на столе → Раскладка → Сборка → Отгрузка**,
    плюс управление исходящими рейсами (dispatches) и аутентификацию.

    ## Два стиля ответов об ошибках

    В системе сосуществуют **два разных формата ошибок** — это не баг, а граница между
    модулем аутентификации и бизнес-модулями. Клиент обязан уметь разбирать оба:

    1. **Модуль `auth` (`/auth/*`)** — ошибки в виде **простого текста** (`text/plain`),
       тело — голая строка вроде `unauthorized` (через `http.Error`, с завершающим `\n`).
       Конверт `{success,data,error}` здесь **не используется**.
    2. **Бизнес-модули** (`receiving`, `putaway`, `assembly`, `shipping`, `dispatches`) —
       единый **JSON-конверт** (`application/json`):
       `{"success": false, "data": null, "error": {"code": "...", "message": "..."}}`.
       `message` — на русском, `code` — машинно-читаемый ASCII.
    3. **`GET /health`** — отдельный формат: голый JSON-объект `{status, checks, time}`
       (без конверта), `200` если `ok`, `503` если `degraded`.

    ## Аутентификация

    Все эндпоинты, кроме `/auth/login`, `/auth/refresh`, `/health`, требуют заголовок
    `Authorization: Bearer <access_token>` (JWT, HS256). Бизнес-модули дополнительно
    проверяют роль через RBAC-гейты (см. описание каждой операции). Большинство
    операций доступны **только роли `OPERATOR`**; исключения — `POST /auth/register`
    (только `ADMIN`) и `POST /assembly/allocate` (`ADMIN` или `OPERATOR`, issue #39).

    ## Строгий разбор тела (DisallowUnknownFields)

    Все тела запросов декодируются с `json.Decoder.DisallowUnknownFields()`. **Любое
    лишнее поле в теле приводит к `400`.** Поэтому каждая схема запроса помечена
    `additionalProperties: false`.

    ## Связанная документация

    - Сквозной путь товара: `../business-process/end-to-end-flow.md`
    - Диаграммы потоков данных (DFD): `../business-process/data-flow-diagrams.md`
    - Flow по этапам: `../flows/receiving-gate-flow.md`, `../flows/receiving-table-flow.md`,
      `../flows/putaway-flow.md`, `../flows/assembly-flow.md`, `../flows/shipping-flow.md`
    - Модель данных: `../data-model/entity-lifecycle.md`, `../data-model/er-diagram.md`,
      `../db/Database_ru_v2.md`
    - Интеграция с блокчейном: `../integration/blockchain-mapping.md`,
      `../integration/data-contract.md`, `../integration/batch-mapping-approach.md`
    - Архитектура: `../architecture/system-overview.md`, `../CONVENTIONS.md`, `../MR_GUIDE.md`

servers:
  - url: http://localhost:8081
    description: Локальная разработка / e2e (WMS_URL по умолчанию)

tags:
  - name: Auth
    description: Аутентификация и регистрация пользователей. Ошибки — простой текст (text/plain).
  - name: Receiving
    description: Приёмка на КПП и на столе. RBAC — только OPERATOR.
  - name: Putaway
    description: Раскладка из буфера в ячейки хранения. RBAC — только OPERATOR.
  - name: Assembly
    description: Аллокация, подбор и сборка заказов. RBAC — OPERATOR (кроме /allocate — ADMIN или OPERATOR).
  - name: Dispatches
    description: Управление плановыми исходящими рейсами (CRUD). RBAC — только OPERATOR.
  - name: Shipping
    description: Отгрузка товаров на рейс. RBAC — только OPERATOR.
  - name: System
    description: Служебные эндпоинты (health-check).

security:
  - bearerAuth: []

paths:
  # ──────────────────────────────────────────────────────────────────────────
  # SYSTEM
  # ──────────────────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [System]
      summary: Health-check сервиса
      description: |
        Проверяет PostgreSQL, Kafka и ledger-adapter. **Особый формат ответа:** голый
        JSON-объект `{status, checks, time}` без конверта `{success,data,error}`.
        Возвращает `200` при `status="ok"` и `503` при `status="degraded"`.
        Используется wait-стратегией testcontainers и `waitForHTTP` в e2e.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Все зависимости живы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                checks:
                  postgres: ok
                  kafka: ok
                  ledger_adapter: ok
                time: '2026-05-31T10:00:00Z'
        '503':
          description: Хотя бы одна зависимость недоступна (degraded).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: degraded
                checks:
                  postgres: ok
                  kafka: ok
                  ledger_adapter: 'Get "http://ledger-adapter:9090/health": dial tcp: connection refused'
                time: '2026-05-31T10:00:00Z'

  # ──────────────────────────────────────────────────────────────────────────
  # AUTH (plain-text errors)
  # ──────────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      tags: [Auth]
      summary: Вход по логину/паролю
      description: |
        Публичный эндпоинт. Возвращает пару JWT (access + refresh). Тело успешного
        ответа — **сырой JSON без конверта** (`TokenPair`). Ошибки — **простой текст**.
        Только метод POST.
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: operator
              password: operator
      responses:
        '200':
          description: Успешная аутентификация. Сырой JSON без конверта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          $ref: '#/components/responses/AuthPlainTextBadRequest'
        '401':
          $ref: '#/components/responses/AuthPlainTextUnauthorized'
        '500':
          $ref: '#/components/responses/AuthPlainTextInternal'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление access-токена по refresh-токену
      description: |
        Публичный эндпоинт. Принимает refresh-токен (`type=refresh`), возвращает
        новую пару токенов. Ротации/отзыва нет — старый refresh-токен валиден до
        истечения `exp`. Роль в новый access-токен подтягивается из БД пользователя.
        Ошибки — простой текст.
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      responses:
        '200':
          description: Новая пара токенов. Сырой JSON без конверта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/AuthPlainTextBadRequest'
        '401':
          $ref: '#/components/responses/AuthPlainTextUnauthorized'
        '500':
          $ref: '#/components/responses/AuthPlainTextInternal'

  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация пользователя (только ADMIN)
      description: |
        **Требует `Authorization: Bearer <access_token>` с ролью `ADMIN`.** Проверка
        двойная: сначала по claim роли в JWT, затем повторная сверка с БД (актёр должен
        быть `is_active=true` и `role=ADMIN`). Пароль — 6..72 байт включительно. `role` —
        одно из `ADMIN`, `OPERATOR`, `CUSTOMER`. Ошибки — **простой текст**.
      operationId: authRegister
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: op-1a2b3c4d
              password: e2e-pass-123
              role: OPERATOR
      responses:
        '201':
          description: Пользователь создан (`is_active=true`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              example:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                username: op-1a2b3c4d
        '400':
          $ref: '#/components/responses/AuthPlainTextBadRequest'
        '401':
          $ref: '#/components/responses/AuthPlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/AuthPlainTextForbidden'
        '409':
          description: Пользователь с таким username уже существует. Простой текст.
          content:
            text/plain:
              schema:
                type: string
              example: |
                user already exists
        '500':
          $ref: '#/components/responses/AuthPlainTextInternal'

  # ──────────────────────────────────────────────────────────────────────────
  # RECEIVING — GATE
  # ──────────────────────────────────────────────────────────────────────────
  /receiving/gate/scan-ttn:
    post:
      tags: [Receiving]
      summary: Начать приёмку поставки по коду ТТН
      description: |
        RBAC: только `OPERATOR`. Если поставка в статусе `CREATED`, переводит её в
        `GATE_IN_PROGRESS`. Возвращает список грузомест. Пишет лог `SCAN_TTN`.
        См. `../flows/receiving-gate-flow.md`.
      operationId: receivingScanTTN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanTTNRequest'
            example:
              ttn_code: TTN-GATE-1a2b3c4d
      responses:
        '200':
          description: Поставка открыта для приёмки.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScanTTNResult'
              example:
                success: true
                data:
                  shipment_id: 11111111-1111-1111-1111-111111111111
                  ttn_code: TTN-GATE-1a2b3c4d
                  status: GATE_IN_PROGRESS
                  cargoplaces:
                    - cargoplace_id: 22222222-2222-2222-2222-222222222222
                      cargoplace_code: CP-GATE-A-1a2b3c4d
                      status: EXPECTED
                  total_cargoplaces: 2
                  received_cargoplaces: 0
                error: null
        '400':
          $ref: '#/components/responses/JSONBadRequest'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`TTN_NOT_FOUND` — поставка с таким ТТН не найдена.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: TTN_NOT_FOUND, message: Поставка с таким ТТН не найдена }
        '409':
          description: '`SHIPMENT_ALREADY_CLOSED` — поставка уже в статусе GATE_CLOSED.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: SHIPMENT_ALREADY_CLOSED, message: Приёмка по поставке уже завершена }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /receiving/gate/scan-cargoplace:
    post:
      tags: [Receiving]
      summary: Отметить грузоместо принятым на КПП
      description: |
        RBAC: только `OPERATOR`. Переводит грузоместо `EXPECTED → RECEIVED_AT_GATE`.
        Если принято последнее — авто-закрытие поставки в `GATE_CLOSED`.
        Примечание: `progress.not_received` в этом ответе всегда `0`.
      operationId: receivingScanGateCargoplace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanGateCargoplaceRequest'
            example:
              shipment_id: 11111111-1111-1111-1111-111111111111
              cargoplace_code: CP-GATE-A-1a2b3c4d
      responses:
        '200':
          description: Грузоместо принято.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScanGateCargoplaceResult'
              example:
                success: true
                data:
                  cargoplace_id: 22222222-2222-2222-2222-222222222222
                  cargoplace_code: CP-GATE-A-1a2b3c4d
                  status: RECEIVED_AT_GATE
                  received_at_gate_at: '2026-05-31T10:15:00Z'
                  progress: { total: 2, received: 1, remaining: 1, not_received: 0 }
                error: null
        '400':
          description: |
            `INVALID_REQUEST` (битый JSON / не-UUID / невалидный cargoplace_code) или
            `CARGOPLACE_NOT_IN_SHIPMENT` (код грузоместа не найден в этой поставке).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: CARGOPLACE_NOT_IN_SHIPMENT, message: Грузоместо не принадлежит данной поставке }
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`SHIPMENT_NOT_FOUND` — поставка не найдена.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: SHIPMENT_NOT_FOUND, message: Поставка не найдена }
        '409':
          description: |
            `SHIPMENT_NOT_IN_PROGRESS` (поставка не в GATE_IN_PROGRESS) или
            `CARGOPLACE_ALREADY_RECEIVED` (грузоместо уже принято).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: CARGOPLACE_ALREADY_RECEIVED, message: Грузоместо уже принято на КПП }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /receiving/gate/accept-shipment:
    post:
      tags: [Receiving]
      summary: Закрыть приёмку поставки на КПП
      description: |
        RBAC: только `OPERATOR`. Помечает все оставшиеся `EXPECTED` грузоместа как
        `NOT_RECEIVED`, переводит поставку в `GATE_CLOSED`.
        Примечание: `summary.remaining` в этом ответе всегда `0`.
      operationId: receivingAcceptShipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptShipmentRequest'
            example:
              shipment_id: 11111111-1111-1111-1111-111111111111
      responses:
        '200':
          description: Приёмка закрыта.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AcceptShipmentResult'
              example:
                success: true
                data:
                  shipment_id: 11111111-1111-1111-1111-111111111111
                  status: GATE_CLOSED
                  summary: { total: 2, received: 1, remaining: 0, not_received: 1 }
                error: null
        '400':
          $ref: '#/components/responses/JSONBadRequest'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`SHIPMENT_NOT_FOUND` — поставка не найдена.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: SHIPMENT_NOT_FOUND, message: Поставка не найдена }
        '409':
          description: '`SHIPMENT_NOT_IN_PROGRESS` — поставка не в GATE_IN_PROGRESS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: SHIPMENT_NOT_IN_PROGRESS, message: Приёмка по поставке не начата }
        '500':
          $ref: '#/components/responses/JSONInternal'

  # ──────────────────────────────────────────────────────────────────────────
  # RECEIVING — TABLE
  # ──────────────────────────────────────────────────────────────────────────
  /receiving/table/scan-cargoplace:
    post:
      tags: [Receiving]
      summary: Начать обработку грузоместа на столе
      description: |
        RBAC: только `OPERATOR`. Переводит грузоместо `RECEIVED_AT_GATE → TABLE_IN_PROGRESS`,
        возвращает ожидаемый манифест SKU. См. `../flows/receiving-table-flow.md`.
      operationId: receivingScanTableCargoplace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanTableCargoplaceRequest'
            example:
              cargoplace_id: 22222222-2222-2222-2222-222222222222
      responses:
        '200':
          description: Грузоместо открыто на столе.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScanTableCargoplaceResult'
              example:
                success: true
                data:
                  cargoplace_id: 22222222-2222-2222-2222-222222222222
                  cargoplace_code: CP-GATE-A-1a2b3c4d
                  status: TABLE_IN_PROGRESS
                  expected_skus:
                    - sku_id: 33333333-3333-3333-3333-333333333333
                      sku_name: Ноутбук Lenovo X1
                      expected_qty: 10
                  total_expected: 10
                error: null
        '400':
          $ref: '#/components/responses/JSONBadRequest'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`CARGOPLACE_NOT_FOUND` — грузоместо не найдено.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: CARGOPLACE_NOT_FOUND, message: Грузоместо не найдено }
        '409':
          description: '`CARGOPLACE_NOT_RECEIVED_AT_GATE` — грузоместо не в статусе RECEIVED_AT_GATE.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: CARGOPLACE_NOT_RECEIVED_AT_GATE, message: Грузоместо не принято на КПП }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /receiving/table/scan-box:
    post:
      tags: [Receiving]
      summary: Идентифицировать или создать коробку в грузоместе
      description: 'RBAC: только `OPERATOR`. Upsert коробки. Существующая `CLOSED` коробка отклоняется.'
      operationId: receivingScanBox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanBoxRequest'
            example:
              cargoplace_id: 22222222-2222-2222-2222-222222222222
              box_barcode: BOX-E2E-1a2b3c4d
      responses:
        '200':
          description: Коробка идентифицирована/создана.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScanBoxResult'
              example:
                success: true
                data:
                  box_id: 44444444-4444-4444-4444-444444444444
                  box_barcode: BOX-E2E-1a2b3c4d
                  status: OPEN
                error: null
        '400':
          $ref: '#/components/responses/JSONBadRequest'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`CARGOPLACE_NOT_FOUND` — грузоместо не найдено.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `CARGOPLACE_NOT_IN_PROGRESS` (грузоместо не в TABLE_IN_PROGRESS) или
            `BOX_NOT_OPEN` (коробка с таким штрихкодом уже CLOSED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: BOX_NOT_OPEN, message: Коробка уже закрыта }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /receiving/table/scan-sku:
    post:
      tags: [Receiving]
      summary: Идентифицировать SKU по штрихкоду (без создания товара)
      description: |
        RBAC: только `OPERATOR`. Резолвит штрихкод в SKU. **Товар не создаётся.**
        Возвращает захардкоженное сообщение `Наклейте QR на товар`.
      operationId: receivingScanSKU
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanSKURequest'
            example:
              cargoplace_id: 22222222-2222-2222-2222-222222222222
              box_id: 44444444-4444-4444-4444-444444444444
              barcode: '4600000099999'
      responses:
        '200':
          description: SKU идентифицирован.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScanSKUResult'
              example:
                success: true
                data:
                  sku_id: 33333333-3333-3333-3333-333333333333
                  sku_name: Ноутбук Lenovo X1
                  barcode: '4600000099999'
                  message: Наклейте QR на товар
                error: null
        '400':
          description: '`INVALID_REQUEST` или `BOX_NOT_IN_CARGOPLACE` (box.cargoplace_id ≠ запросу).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`CARGOPLACE_NOT_FOUND`, `BOX_NOT_FOUND` или `BARCODE_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: BARCODE_NOT_FOUND, message: Штрихкод не зарегистрирован }
        '409':
          description: '`CARGOPLACE_NOT_IN_PROGRESS` или `BOX_NOT_OPEN`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/JSONInternal'

  /receiving/table/scan-qr:
    post:
      tags: [Receiving]
      summary: Зарегистрировать QR-код товара (создаёт товар)
      description: |
        RBAC: только `OPERATOR`. Создаёт строку `products` со статусом `RECEIVED` и
        уникальным QR. Дубликат QR → `409 QR_ALREADY_EXISTS`.
      operationId: receivingScanQR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanQRRequest'
