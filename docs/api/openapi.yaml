  # ──────────────────────────────────────────────────────────────────────────
  # SHIPPING
  # ──────────────────────────────────────────────────────────────────────────
  /shipping/scan-buffer:
    post:
      tags: [Shipping]
      summary: Осмотреть буфер отгрузки
      description: |
        RBAC: только `OPERATOR`. Возвращает метаданные SHIPPING_BUFFER-ячейки и все
        `READY_TO_SHIP` товары в ней. Только чтение. См. `../flows/shipping-flow.md`.
      operationId: shippingScanBuffer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShippingScanBufferRequest'
            example:
              buffer_bin_id: bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb
      responses:
        '200':
          description: Содержимое буфера отгрузки.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScanBufferResponse'
              example:
                success: true
                data:
                  buffer_bin:
                    id: bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb
                    code: SHIP-BUF-01
                    destination:
                      id: 88888888-8888-8888-8888-888888888888
                      code: DEST-01
                      name: Магазин №1
                  products:
                    - product_id: 55555555-5555-5555-5555-555555555555
                      qr_code: QR-E2E-1a2b3c4d
                      sku_name: Ноутбук Lenovo X1
                      order_external_no: EXT-ORDER-001
                  count: 1
                error: null
        '400':
          description: '`INVALID_REQUEST` или `BIN_NOT_SHIPPING_BUFFER` (section≠SHIPPING_BUFFER или нет destination).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: BIN_NOT_SHIPPING_BUFFER, message: Ячейка не является буфером отгрузки }
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`BIN_NOT_FOUND` — ячейка не найдена.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/JSONInternal'

  /shipping/scan-driver:
    post:
      tags: [Shipping]
      summary: Зарегистрировать прибытие водителя по коду рейса
      description: |
        RBAC: только `OPERATOR`. Переводит рейс `SCHEDULED → AT_GATE` (идемпотентно,
        если уже `AT_GATE`). Терминальные статусы дают `409`.
      operationId: shippingScanDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanDriverRequest'
            example:
              dispatch_code: DSP-2026-0531-001
      responses:
        '200':
          description: Рейс у ворот (AT_GATE).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ScanDriverResponse'
              example:
                success: true
                data:
                  dispatch_id: cccccccc-cccc-cccc-cccc-cccccccccccc
                  dispatch_code: DSP-2026-0531-001
                  vehicle_number: А123ВС77
                  driver_name: Иванов Иван
                  driver_phone: '+79001234567'
                  destination: { id: 88888888-8888-8888-8888-888888888888, code: DEST-01, name: Магазин №1 }
                  status: AT_GATE
                  arrived_at: '2026-06-01T09:55:00Z'
                error: null
        '400':
          description: '`INVALID_REQUEST` — пустой dispatch_code или нераспознанный терминальный статус рейса.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`DISPATCH_NOT_FOUND` — рейс с таким кодом не найден.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: DISPATCH_NOT_FOUND, message: Рейс не найден }
        '409':
          description: '`DISPATCH_ALREADY_DEPARTED` или `DISPATCH_CANCELLED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: DISPATCH_ALREADY_DEPARTED, message: Рейс уже отбыл }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /shipping/ship/draft:
    post:
      tags: [Shipping]
      summary: Черновик подписанной отгрузки буфера на рейс
      description: |
        RBAC: только `OPERATOR`. `product_ids` опционален: пусто/отсутствует →
        **bulk-режим** (все `READY_TO_SHIP` в ячейке); непусто → **spot-режим** (ровно
        эти товары), максимум 200 элементов. Проверяет `section=SHIPPING_BUFFER`,
        совпадение `destination_id` буфера и рейса, `AT_GATE`, наличие товаров и chain-gate
        сборки: пока Pick-действие товара не `COMMITTED` в цепи →
        `409 PICKING_NOT_CONFIRMED`. Затем сортирует товары по `itemId`, режет операцию
        на части по ≤ 2000 товаров (ADR-0001 §10) и пишет только черновик — по строке
        `warehouse_actions` на часть. Подписи частей отправляются в
        `POST /shipping/ship/submit`.
      operationId: shippingShipDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipHTTPRequest'
            example:
              buffer_bin_id: bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb
              dispatch_id: cccccccc-cccc-cccc-cccc-cccccccccccc
              product_ids:
                - 55555555-5555-5555-5555-555555555555
      responses:
        '200':
          description: Черновик создан — `operation_id` и части с `challenge`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SignedActionDraft'
              example:
                success: true
                data:
                  operation_id: 01929c5e-6f00-7000-8000-000000004001
                  action_type: 4
                  signer_key_id: '0x6f1c2a7b3d9e4c8a5b2f0d7e6c1a9b8d4e3f2a1c0b9d8e7f6a5b4c3d2e1f0a9b'
                  rp_id: localhost
                  allow_credentials:
                    - type: public-key
                      id: pQECAyYgASFYIB
                  user_verification: required
                  timeout: 60000
                  parts:
                    - action_id: 01929c5e-6f00-7000-8000-000000004002
                      item_ids:
                        - 55555555-5555-5555-5555-555555555555
                      details_hash: '0x7e6d5c4b3a2918f7e6d5c4b3a2918f7e6d5c4b3a2918f7e6d5c4b3a2918f7e6d'
                      challenge: 5hG2fD0cA9bE8dF7gH6iJ5kL4mN3oP
                error: null
        '400':
          description: '`INVALID_REQUEST` — невалидные UUID, >200 `product_ids`; `BIN_NOT_SHIPPING_BUFFER` (section ≠ SHIPPING_BUFFER).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`BIN_NOT_FOUND` или `DISPATCH_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `DISPATCH_ALREADY_DEPARTED`, `DISPATCH_CANCELLED`, `DESTINATION_MISMATCH`
            (destination буфера ≠ destination рейса), `DISPATCH_NOT_AT_GATE`,
            `BUFFER_EMPTY` (bulk-режим, в ячейке нет READY_TO_SHIP) или
            `PRODUCT_NOT_IN_BUFFER` (spot-режим, несовпадение по товарам),
            `PICKING_NOT_CONFIRMED` (Pick-действие товара ещё не COMMITTED в цепи) или
            `SIGNER_KEY_NOT_ACTIVE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                not_at_gate:
                  value:
                    success: false
                    data: null
                    error: { code: DISPATCH_NOT_AT_GATE, message: Рейс не у ворот }
                mismatch:
                  value:
                    success: false
                    data: null
                    error: { code: DESTINATION_MISMATCH, message: Пункт назначения буфера не совпадает с рейсом }
                pickingNotConfirmed:
                  value:
                    success: false
                    data: null
                    error: { code: PICKING_NOT_CONFIRMED, message: 'Сборка части товаров (2 шт.) ещё не подтверждена в цепи. Повторите отгрузку чуть позже' }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /shipping/ship/submit:
    post:
      tags: [Shipping]
      summary: Принять подписи частей и отгрузить товары
      description: |
        RBAC: только `OPERATOR`. Проверяет подписи всех частей и в одной транзакции
        помечает товары `SHIPPED`, пишет `wms_ops.shippings` (у строки — `action_id`
        своей части), продвигает заказы в `SHIPPED` / `PARTIALLY_SHIPPED`, переводит рейс
        в `DEPARTED`, если зона `SHIPPING_BUFFER` пункта назначения опустела, и пишет
        **по строке `outbox_events` на каждую часть** (`aggregate_type=signed_action`,
        `event_type=wms.action.v1`). В цепи это Ship-действие:
        `SignedMappingWMS.applyActions`, FSM на каждый товар `Picked → Shipped` —
        финальный переход. Chain-gate сборки перепроверяется на подписанном наборе
        (`409 PICKING_NOT_CONFIRMED`), состав черновика — тоже (`409 DRAFT_STALE`).
        `buffer_remaining` считается по **всей зоне SHIPPING_BUFFER пункта назначения**,
        а не по одной ячейке.
      operationId: shippingShipSubmit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedActionSubmitRequest'
            example:
              operation_id: 01929c5e-6f00-7000-8000-000000004001
              assertions:
                - action_id: 01929c5e-6f00-7000-8000-000000004002
                  credential_id: pQECAyYgASFYIB
                  authenticator_data: ZmxhZ3M
                  client_data_json: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0In0
                  signature: MEUCIQD
      responses:
        '200':
          description: Отгрузка выполнена, по строке outbox на каждую часть операции.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ShipResponse'
              examples:
                full:
                  summary: Полная отгрузка, рейс отбыл
                  value:
                    success: true
                    data:
                      products_shipped: 3
                      outbox_events_created: 1
                      orders_completed: 1
                      orders_partially_shipped: 0
                      dispatch_departed: true
                      buffer_remaining: 0
                      operation_id: 01929c5e-6f00-7000-8000-000000004001
                    error: null
                partial:
                  summary: Частичная отгрузка
                  value:
                    success: true
                    data:
                      products_shipped: 2
                      outbox_events_created: 1
                      orders_completed: 0
                      orders_partially_shipped: 1
                      dispatch_departed: false
                      buffer_remaining: 1
                      operation_id: 01929c5e-6f00-7000-8000-000000004001
                    error: null
        '400':
          description: '`INVALID_REQUEST` (битый JSON, не-UUID), `INVALID_ASSERTION` (подпись части не прошла проверку) или `BIN_NOT_SHIPPING_BUFFER`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`OPERATION_NOT_FOUND`, `BIN_NOT_FOUND` или `DISPATCH_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: |
            `OPERATION_ALREADY_SUBMITTED`, `DRAFT_STALE` (товар ушёл из буфера),
            `PICKING_NOT_CONFIRMED`, `DISPATCH_ALREADY_DEPARTED`, `DISPATCH_CANCELLED`,
            `DESTINATION_MISMATCH`, `DISPATCH_NOT_AT_GATE` или `SIGNER_KEY_NOT_ACTIVE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/JSONInternal'

  # ──────────────────────────────────────────────────────────────────────────
  # PASSKEYS
  # ──────────────────────────────────────────────────────────────────────────
  /passkeys/registration/begin:
    post:
      tags: [Passkeys]
      summary: Начать регистрацию passkey
      description: |
        RBAC: `ADMIN` или `OPERATOR`. Создаёт сессию регистрации (в памяти процесса,
        TTL 5 минут, одна сессия на пользователя) и отдаёт опции WebAuthn — браузер
        передаёт `data.publicKey` в `navigator.credentials.create`. `residentKey: preferred`,
        `userVerification: required`, алгоритм ES256 (alg -7), attestation none.
        Живой ключ (`PENDING`/`ACTIVE`) у пользователя только один, поэтому повторная
        регистрация до отклонения или отзыва ключа даёт `409`.
      operationId: passkeysRegistrationBegin
      responses:
        '200':
          description: Сессия регистрации создана, опции WebAuthn в `data.publicKey`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PasskeyCreationOptions'
              example:
                success: true
                data:
                  publicKey:
                    rp: { id: localhost, name: WMS }
                    user:
                      id: aWNhbmV2ZXItc2lnbg
                      name: op-1a2b3c4d
                      displayName: op-1a2b3c4d
                    challenge: 5hG2fD0cA9bE8dF7gH6iJ5kL4mN3oPqR0sT
                    pubKeyCredParams:
                      - type: public-key
                        alg: -7
                    timeout: 60000
                    authenticatorSelection:
                      residentKey: preferred
                      userVerification: required
                    attestation: none
                error: null
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          description: |
            `FORBIDDEN` — роль не разрешена (RBAC-гейт), или `NO_ORGANIZATION` —
            пользователь не принадлежит организации (сервис passkeys).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: NO_ORGANIZATION, message: Пользователь не принадлежит организации }
        '409':
          description: '`PASSKEY_EXISTS` — у пользователя уже есть живой ключ (`PENDING` или `ACTIVE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: PASSKEY_EXISTS, message: Ключ уже зарегистрирован }
        '500':
          $ref: '#/components/responses/JSONInternal'

  /passkeys/registration/finish:
    post:
      tags: [Passkeys]
      summary: Завершить регистрацию passkey (attestation)
      description: |
        RBAC: `ADMIN` или `OPERATOR`. Принимает JSON attestation — сырой результат
        `navigator.credentials.create` (`RegistrationResponseJSON`, тело до 64 KiB).
        Сессия из `begin` одноразовая и живёт 5 минут: без неё или с истёкшей —
        `400 INVALID_REGISTRATION`. Проверка attestation требует флаг UV и P-256
        ключ пользователя; ключ сохраняется в `passkey_credentials` со статусом
        `PENDING`. Дальше его активирует админ (action_type 5, реестр цепи),
        а статус отображают `GET /passkeys/me` и `GET /passkeys/organization`.
      operationId: passkeysRegistrationFinish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyRegistrationResponse'
            example:
              id: vEJYj3dHhit9F8qLm0RGjXYkKluWjdI6W_1Lb3tQ6HA
              rawId: vEJYj3dHhit9F8qLm0RGjXYkKluWjdI6W_1Lb3tQ6HA
              type: public-key
              response:
                clientDataJSON: eyJ0eXBlIjoid2ViYXV0aG4uY3JlYXRlIn0
                attestationObject: o2NmbXRpb25lLXN0emlwYXRpb25Ob25lZ2F0dFN0bXQ
                transports:
                  - internal
              clientExtensionResults: {}
              authenticatorAttachment: platform
      responses:
        '201':
          description: Ключ сохранён в `passkey_credentials` со статусом `PENDING`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PasskeyView'
              example:
                success: true
                data:
                  credential_id: vEJYj3dHhit9F8qLm0RGjXYkKluWjdI6W_1Lb3tQ6HA
                  key_id: '0x6f1c2a7b3d9e4c8a5b2f0d7e6c1a9b8d4e3f2a1c0b9d8e7f6a5b4c3d2e1f0a9b'
                  qx: '0x3f95d6e1c8b0a277441955670e8a2b1c4d5e6f708192a3b4c5d6e7f8091a2b37'
                  qy: '0x4fa06e7f2d9c1b38840289755e5a0cc2b39c40d5f8a709e1b2c9d6e7f08fa3b4'
                  role: OPERATOR
                  status: PENDING
                  created_at: '2026-05-31T10:30:00Z'
                error: null
        '400':
          description: |
            `INVALID_REGISTRATION` — битый JSON или тело больше 64 KiB, нет/истекла
            сессия регистрации (`begin` не вызывался, параллельный `finish`, TTL 5 минут),
            attestation не прошёл проверку, нет флага UV, ключ не P-256.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: INVALID_REGISTRATION, message: Некорректная регистрация passkey }
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          description: |
            `FORBIDDEN` — роль не разрешена (RBAC-гейт), или `NO_ORGANIZATION` —
            пользователь не принадлежит организации (сервис passkeys).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: NO_ORGANIZATION, message: Пользователь не принадлежит организации }
        '409':
          description: '`PASSKEY_EXISTS` — у пользователя уже есть живой ключ (`PENDING` или `ACTIVE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: PASSKEY_EXISTS, message: Ключ уже зарегистрирован }
        '500':
          $ref: '#/components/responses/JSONInternal'

