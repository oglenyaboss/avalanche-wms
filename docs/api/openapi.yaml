  /receiving/table/close-cargoplace/draft:
    post:
      tags: [Receiving]
      summary: Черновик подписанного закрытия грузоместа
      description: |
        RBAC: только `OPERATOR`. Сверяет ожидаемые SKU с реально принятыми товарами,
        сортирует товары грузоместа по `itemId` и режет операцию на части по ≤ 2000
        товаров (ADR-0001 §10). Пишет только черновик — по строке `warehouse_actions` на
        часть (`action_id`, соль, `details_hash`, `challenge`). Ответ — то, что подписывает
        passkey оператора (WebAuthn P-256, `user_verification: required`); подписи
        отправляются в `POST /receiving/table/close-cargoplace/submit`. Состояние операции
        в цепи — `GET /signed-actions/operations/{operation_id}`.
      operationId: receivingCloseCargoplaceDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseCargoplaceRequest'
            example:
              cargoplace_id: 22222222-2222-2222-2222-222222222222
      responses:
        '200':
          description: Черновик создан — `operation_id` и части с `challenge`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SignedActionDraft'
              example:
                success: true
                data:
                  operation_id: 01929c5e-6f00-7000-8000-000000001001
                  action_type: 1
                  signer_key_id: '0x6f1c2a7b3d9e4c8a5b2f0d7e6c1a9b8d4e3f2a1c0b9d8e7f6a5b4c3d2e1f0a9b'
                  rp_id: localhost
                  allow_credentials:
                    - type: public-key
                      id: pQECAyYgASFYIB
                  user_verification: required
                  timeout: 60000
                  parts:
                    - action_id: 01929c5e-6f00-7000-8000-000000001002
                      item_ids:
                        - 55555555-5555-5555-5555-555555555555
                      details_hash: '0x3d2a91c4e8b7f6a5d4c3b2a1908f7e6d5c4b3a2918f7e6d5c4b3a2918f7e6d5c'
                      challenge: 3q2-7wY0bXk9tR4sP1nM6vL8zJ5hG2fD0cA
                error: null
        '400':
          $ref: '#/components/responses/JSONBadRequest'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`CARGOPLACE_NOT_FOUND` — грузоместо не найдено.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`CARGOPLACE_NOT_IN_PROGRESS` — грузоместо не в `TABLE_IN_PROGRESS`; `SIGNER_KEY_NOT_ACTIVE` — у оператора нет активного в реестре passkey.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          $ref: '#/components/responses/JSONInternal'

  /receiving/table/close-cargoplace/submit:
    post:
      tags: [Receiving]
      summary: Принять подписи частей и закрыть грузоместо
      description: |
        RBAC: только `OPERATOR`. Проверяет WebAuthn-подписи всех частей и в одной
        транзакции переводит грузоместо в `TABLE_CLOSED`, пишет лог `receiving_table` и
        **по одной строке `outbox_events` на каждую часть** (`aggregate_type=signed_action`,
        `event_type=wms.action.v1`, `event_id = action_id`, `payload` — конверт действия).
        Debezium публикует их в топик `wms.events.v1`, Ledger Adapter вызывает
        `SignedMappingWMS.applyActions`; FSM контракта ведётся на каждый товар
        (None → Accepted). Идемпотентность — guard статуса: повтор →
        `409 CARGOPLACE_NOT_IN_PROGRESS`.
      operationId: receivingCloseCargoplaceSubmit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignedActionSubmitRequest'
            example:
              operation_id: 01929c5e-6f00-7000-8000-000000001001
              assertions:
                - action_id: 01929c5e-6f00-7000-8000-000000001002
                  credential_id: pQECAyYgASFYIB
                  authenticator_data: ZmxhZ3M
                  client_data_json: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0In0
                  signature: MEUCIQD
      responses:
        '200':
          description: Грузоместо закрыто, по строке outbox на каждую часть операции.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CloseCargoplaceResult'
              example:
                success: true
                data:
                  cargoplace_id: 22222222-2222-2222-2222-222222222222
                  operation_id: 01929c5e-6f00-7000-8000-000000001001
                  status: TABLE_CLOSED
                  summary:
                    products_received: 18
                    products_expected: 20
                    shortage: 2
                    shortage_by_sku:
                      - sku_name: Ноутбук Lenovo X1
                        expected: 5
                        received: 3
                        shortage: 2
                  outbox_events_created: 1
                error: null
        '400':
          description: '`INVALID_REQUEST` (битый JSON, не-UUID) или `INVALID_ASSERTION` (подпись части не прошла проверку).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`OPERATION_NOT_FOUND` — операция не найдена или создана другим пользователем; `CARGOPLACE_NOT_FOUND`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: '`OPERATION_ALREADY_SUBMITTED`, `CARGOPLACE_NOT_IN_PROGRESS` или `SIGNER_KEY_NOT_ACTIVE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: OPERATION_ALREADY_SUBMITTED, message: Операция уже отправлена }
        '500':
          $ref: '#/components/responses/JSONInternal'

