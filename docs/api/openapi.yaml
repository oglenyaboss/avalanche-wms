            `SIGNER_KEY_NOT_ACTIVE` — ключ подписанта не `ACTIVE` в реестре цепи,
            `ACTION_IN_PROGRESS` — последнее действие целевого ключа ещё в полёте (`SENT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: SIGNER_KEY_NOT_ACTIVE, message: Ключ администратора не активен в реестре }
        '503':
          description: '`REGISTRY_UNAVAILABLE` — реестр цепи не ответил при проверке ключа подписанта; ничего не подписывается. Повторите позже.'
          content:
            application/json:
