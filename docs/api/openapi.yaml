                    qr_code: QR-E2E-1a2b3c4d
                    sku_name: Товар 1
                    status: STORED
                  steps:
                    - stage: receiving
                      event_type: wms.action.v1
                      occurred_at: '2026-05-31T10:20:00Z'
                      event_id: 01929c5e-6f00-7000-8000-000000001002
                      tx_hash: '0x2be804dde1e3a1578819c47b5f8e0e31f3a10c7b4d5e6f708192a3b4c5d6e7f80'
                      chain_status: COMMITTED
                      chain_updated_at: '2026-05-31T10:25:00Z'
                      error_message: null
                    - stage: putaway
                      event_type: wms.action.v1
                      occurred_at: '2026-05-31T10:40:00Z'
                      event_id: 01929c5e-6f00-7000-8000-000000002002
                      tx_hash: null
                      chain_status: SENT
                      chain_updated_at: null
                      error_message: null
                error: null
        '400':
          description: '`MISSING_KEY` — параметр `key` обязателен (пустой или отсутствует).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                data: null
                error: { code: MISSING_KEY, message: Укажите product_id или QR-код }
        '401':
          $ref: '#/components/responses/PlainTextUnauthorized'
        '403':
          $ref: '#/components/responses/JSONForbidden'
        '404':
          description: '`PRODUCT_NOT_FOUND` — `key` не UUID товара и не QR-код существующего товара.'
