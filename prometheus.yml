global:
  scrape_interval: 10s

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: kafka
    static_configs:
      - targets: ['kafka-jmx-exporter:5556']

  - job_name: debezium
    static_configs:
      - targets: ['debezium-jmx-exporter:5556']
