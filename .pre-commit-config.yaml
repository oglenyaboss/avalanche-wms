repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key

  # ── Go: форматирование ──────────────────────────────
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        files: ^(wms|ledger-adapter)/.*\.go$
      - id: go-imports
        files: ^(wms|ledger-adapter)/.*\.go$

  # ── Go: линтинг ─────────────────────────────────────
  - repo: https://github.com/golangci/golangci-lint
    rev: v1.62.0
    hooks:
      - id: golangci-lint
        name: golangci-lint (wms)
        entry: bash -c 'cd wms && golangci-lint run --config ../.golangci.yml --timeout=5m ./...'
        language: system
        files: ^wms/.*\.go$
        types: [go]
        pass_filenames: false
        args: []
      - id: golangci-lint
        name: golangci-lint (ledger-adapter)
        entry: bash -c 'cd ledger-adapter && golangci-lint run --config ../.golangci.yml --timeout=5m ./...'
        language: system
        files: ^ledger-adapter/.*\.go$
        types: [go]
        pass_filenames: false
        args: []

  # ── Go: тесты и модули ──────────────────────────────
  - repo: local
    hooks:
      - id: go-test-wms
        name: go tests (wms)
        entry: bash -c 'cd wms && go test ./...'
        language: system
        types: [go]
        files: ^wms/.*\.go$
        pass_filenames: false
      - id: go-test-ledger
        name: go tests (ledger-adapter)
        entry: bash -c 'cd ledger-adapter && go test ./...'
        language: system
        types: [go]
        files: ^ledger-adapter/.*\.go$
        pass_filenames: false
      - id: go-mod-tidy-wms
        name: go mod tidy (wms)
        entry: bash -c 'cd wms && go mod tidy && git diff --exit-code -- go.mod go.sum'
        language: system
        files: ^wms/go\.mod$
        pass_filenames: false
      - id: go-mod-tidy-ledger
        name: go mod tidy (ledger-adapter)
        entry: bash -c 'cd ledger-adapter && go mod tidy && git diff --exit-code -- go.mod go.sum'
        language: system
        files: ^ledger-adapter/go\.mod$
        pass_filenames: false

      # ── Conventional Commits ──────────────────────────
      - id: conventional-commit
        name: conventional commit message
        entry: scripts/hooks/conventional-commit.sh
        language: system
        stages: [commit-msg]
        always_run: true

      # ── Branch naming ─────────────────────────────────
      - id: branch-name
        name: branch name convention
        entry: scripts/hooks/branch-name.sh
        language: system
        stages: [pre-push]
        always_run: true
