wms_lint:
  extends: .go_lint_template
  variables:
    WORKDIR: wms
  rules:
    - changes:
        - wms/**/*

wms_test:
  extends: .go_test_template
  variables:
    WORKDIR: wms
    GO_IMAGE: golang:1.24-alpine
  rules:
    - changes:
        - wms/**/*

wms_build_&_deploy:
  extends: .docker_build_template
  rules:
    - changes:
        - wms/**/*
  script:
    - docker build ./wms -t wms-service
    - echo "pushin' to some registry"
