wms_lint:
  stage: lint
  tags: [docker]
  image: golang:1.24-alpine
  rules:
    - changes:
        - wms/**/*
  script:
    - cd wms
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - golangci-lint run --config ../.golangci.yml --timeout=5m ./...

wms_test:
  stage: test
  tags: [docker]
  image: golang:1.24-alpine
  rules:
    - changes:
        - wms/**/*
  script:
    - cd wms
    - go test -race -count=1 ./...

wms_build_&_deploy:
  stage: build_&_deploy
  tags: [docker]
  image: docker:24.0.5
  rules:
    - changes:
        - wms/**/*
  script:
    - docker build ./wms -t wms-service
    - echo "pushin' to some registry"
