ledger_adapter_lint:
  extends: .go_lint_install_template
  variables:
    WORKDIR: ledger-adapter
    GO_IMAGE: golang:1.25
  rules:
    - changes:
        - ledger-adapter/**/*

ledger_adapter_test:
  extends: .go_test_template
  variables:
    WORKDIR: ledger-adapter
    GO_IMAGE: golang:1.25
  rules:
    - changes:
        - ledger-adapter/**/*

ledger_adapter_build_&_deploy:
  extends: .docker_build_template
  rules:
    - changes:
        - ledger-adapter/**/*
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build ./ledger-adapter -t $CI_REGISTRY_IMAGE/ledger-adapter:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/ledger-adapter:$CI_COMMIT_SHORT_SHA
