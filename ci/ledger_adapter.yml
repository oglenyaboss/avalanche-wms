ledger_adapter_lint:
  stage: lint
  tags: [docker]
  image: golang:tip-20260207-alpine3.23
  rules:
    - changes:
        - ledger_adapter/**/*
        - ledger_adapter/**/*
  script:
    - cd ledger_adapter
    - go get .
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
    - golangci-lint run .

ledger_adapter_test:
  stage: test
  tags: [docker]
  image: golang:tip-20260207-alpine3.23
  rules:
    - changes:
        - ledger_adapter/**/*
        - ledger_adapter/**/*
  script:
    - cd ledger_adapter
    - go test -v

ledger_adapter_build_&_deploy:
  stage: build_&_deploy
  tags: [docker]
  image: docker:24.0.5
  rules:
    - changes:
        - ledger_adapter/**/*
        - ledger_adapter/**/*
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build ./ledger_adapter -t registry.miem.hse.ru/2340/blockchain_project/ledger_adapter:$CI_COMMIT_SHORT_SHA 
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    - echo "mb you should use artifactory?"